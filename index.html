  // ================= FOLLOW-UP MANAGEMENT MODULE =================
  // Self-contained addition: its own Firestore collection (followups), its own
  // state slice (state.followups / fuView / fuFilters / fuSort / fuPage...),
  // and its own render/wire functions below. Linked to the existing client
  // database via companyId / contactId so every follow-up traces back to its
  // company and decision-maker record without touching those modules.

  fuToday() { return UI.todayISO(); },

  fuDaysRemaining(dateStr) {
    if (!dateStr) return null;
    const today = new Date(this.fuToday());
    const d = new Date(dateStr);
    return Math.round((d - today) / 86400000);
  },

  fuIsOverdue(f) {
    return !!(f.nextFollowUpDate && f.nextFollowUpDate < this.fuToday() && !['Completed', 'Cancelled', 'Closed'].includes(f.status));
  },

  fuEnrich(f) {
    return { ...f, _daysRemaining: this.fuDaysRemaining(f.nextFollowUpDate), _overdue: this.fuIsOverdue(f) };
  },

  fuAll() { return this.state.followups.map(f => this.fuEnrich(f)); },

  fuFindDuplicate(companyId, purpose, excludeId) {
    return this.state.followups.find(x => x.id !== excludeId && x.companyId === companyId && x.purpose === purpose && !['Completed', 'Cancelled', 'Closed'].includes(x.status));
  },

  fuKpis() {
    const all = this.fuAll();
    const today = this.fuToday();
    const in7 = UI.daysFromNow(7);
    const open = f => !['Completed', 'Cancelled', 'Closed'].includes(f.status);
    return {
      total: all.length,
      dueToday: all.filter(f => f.nextFollowUpDate === today && open(f)).length,
      upcoming: all.filter(f => f.nextFollowUpDate && f.nextFollowUpDate > today && f.nextFollowUpDate <= in7 && open(f)).length,
      overdue: all.filter(f => f._overdue).length,
      completedToday: all.filter(f => f.status === 'Completed' && f.updatedAt && f.updatedAt.slice(0, 10) === today).length,
      highPriority: all.filter(f => ['High', 'Urgent'].includes(f.priority) && open(f)).length,
      meetings: all.filter(f => f.stage === 'Meeting Scheduled' || f.purpose === 'Schedule Meeting' || f.purpose === 'Confirm Meeting').length,
      won: all.filter(f => f.stage === 'Won').length,
      lost: all.filter(f => f.stage === 'Lost').length,
    };
  },

  fuVisible() {
    const { fuSearch, fuFilters, fuQuickFilter, fuSort } = this.state;
    const today = this.fuToday();
    const in7 = UI.daysFromNow(7);
    let list = this.fuAll();

    if (fuQuickFilter === 'dueToday') list = list.filter(f => f.nextFollowUpDate === today && !['Completed', 'Cancelled', 'Closed'].includes(f.status));
    else if (fuQuickFilter === 'overdue') list = list.filter(f => f._overdue);
    else if (fuQuickFilter === 'upcoming') list = list.filter(f => f.nextFollowUpDate && f.nextFollowUpDate > today && f.nextFollowUpDate <= in7);
    else if (fuQuickFilter === 'completedToday') list = list.filter(f => f.status === 'Completed' && f.updatedAt && f.updatedAt.slice(0, 10) === today);
    else if (fuQuickFilter === 'highPriority') list = list.filter(f => ['High', 'Urgent'].includes(f.priority));
    else if (fuQuickFilter === 'meetings') list = list.filter(f => f.stage === 'Meeting Scheduled' || f.purpose === 'Schedule Meeting' || f.purpose === 'Confirm Meeting');
    else if (fuQuickFilter === 'won') list = list.filter(f => f.stage === 'Won');
    else if (fuQuickFilter === 'lost') list = list.filter(f => f.stage === 'Lost');

    if (fuFilters.companyId) list = list.filter(f => f.companyId === fuFilters.companyId);
    if (fuFilters.assignedTo) list = list.filter(f => f.assignedTo === fuFilters.assignedTo);
    if (fuFilters.stage) list = list.filter(f => f.stage === fuFilters.stage);
    if (fuFilters.status) list = list.filter(f => f.status === fuFilters.status);
    if (fuFilters.priority) list = list.filter(f => f.priority === fuFilters.priority);
    if (fuFilters.method) list = list.filter(f => f.method === fuFilters.method);
    if (fuFilters.outcome) list = list.filter(f => f.outcome === fuFilters.outcome);
    if (fuFilters.from) list = list.filter(f => f.nextFollowUpDate && f.nextFollowUpDate >= fuFilters.from);
    if (fuFilters.to) list = list.filter(f => f.nextFollowUpDate && f.nextFollowUpDate <= fuFilters.to);

    if (fuSearch) {
      const s = fuSearch.toLowerCase();
      list = list.filter(f => `${f.clientName} ${f.companyName} ${f.contactName} ${f.jobTitle} ${f.phone} ${f.email} ${f.subject} ${f.notes} ${f.id}`.toLowerCase().includes(s));
    }

    list.sort((a, b) => {
      const { field, dir } = fuSort;
      let va = a[field], vb = b[field];
      if (field === '_daysRemaining') { va = va == null ? 99999 : va; vb = vb == null ? 99999 : vb; }
      else { va = va ?? ''; vb = vb ?? ''; }
      const cmp = va > vb ? 1 : va < vb ? -1 : 0;
      return dir === 'asc' ? cmp : -cmp;
    });
    return list;
  },

  // ---------- MAIN PAGE ----------
  renderFollowupMgmt() {
    const main = document.getElementById('main');
    const k = this.fuKpis();
    const cardsConfig = [
      ['total', 'Total Follow-ups', '📋', ''],
      ['dueToday', 'Due Today', '📅', k.dueToday ? 'warn' : ''],
      ['upcoming', 'Upcoming', '🔭', ''],
      ['overdue', 'Overdue', '⏰', k.overdue ? 'bad' : ''],
      ['completedToday', 'Completed Today', '✅', 'good'],
      ['highPriority', 'High Priority', '🔥', k.highPriority ? 'bad' : ''],
      ['meetings', 'Meetings Scheduled', '🤝', ''],
      ['won', 'Deals Won', '🏆', 'good'],
      ['lost', 'Deals Lost', '✕', 'bad'],
    ];

    let subviewHtml;
    if (this.state.fuView === 'calendar') subviewHtml = this.fuCalendarHtml();
    else if (this.state.fuView === 'analytics') subviewHtml = this.fuAnalyticsHtml();
    else subviewHtml = this.fuTableHtml();

    main.innerHTML = `
      <div class="view-header row">
        <div><h1>Follow-up Management</h1><p class="sub">Every opportunity, meeting, proposal and negotiation — tracked, timed, and never missed.</p></div>
        <div class="header-actions"><button class="btn btn-primary" id="fu-add-btn">+ New Follow-up</button></div>
      </div>
      <div class="kpi-grid">
        ${cardsConfig.map(([key, label, icon, tone], i) => `
          <div class="kpi-card clickable ${this.state.fuQuickFilter === key ? 'kpi-active' : ''}" data-qf="${key}" style="animation-delay:${i * 25}ms">
            <div class="kpi-icon">${icon}</div>
            <div class="kpi-value ${tone}">${k[key]}</div>
            <div class="kpi-label">${label}</div>
          </div>`).join('')}
      </div>
      ${this.fuNotificationsHtml()}
      <div class="view-tabs">
        <div class="view-tab ${this.state.fuView === 'table' ? 'active' : ''}" data-fv="table">📋 Table</div>
        <div class="view-tab ${this.state.fuView === 'calendar' ? 'active' : ''}" data-fv="calendar">📅 Calendar</div>
        <div class="view-tab ${this.state.fuView === 'analytics' ? 'active' : ''}" data-fv="analytics">📊 Analytics</div>
      </div>
      ${subviewHtml}
    `;

    document.getElementById('fu-add-btn').onclick = () => this.openFollowupForm();
    main.querySelectorAll('.kpi-card[data-qf]').forEach(card => {
      card.addEventListener('click', () => {
        const key = card.dataset.qf;
        this.state.fuQuickFilter = this.state.fuQuickFilter === key ? '' : key;
        this.state.fuPage = 1;
        this.renderFollowupMgmt();
      });
    });
    main.querySelectorAll('.notif-item').forEach(item => {
      item.addEventListener('click', () => this.openFollowupForm(item.dataset.id));
    });
    main.querySelectorAll('.view-tab').forEach(tab => {
      tab.addEventListener('click', () => { this.state.fuView = tab.dataset.fv; this.renderFollowupMgmt(); });
    });

    if (this.state.fuView === 'table') this.wireFuTable(main);
    else if (this.state.fuView === 'calendar') this.wireFuCalendar(main);
    else if (this.state.fuView === 'analytics') this.renderFuAnalyticsCharts();
  },

  // ---------- NOTIFICATIONS ----------
  fuNotificationsHtml() {
    const all = this.fuAll();
    const today = this.fuToday();
    const tomorrow = UI.daysFromNow(1);
    const open = f => !['Completed', 'Cancelled', 'Closed'].includes(f.status);
    const overdue = all.filter(f => f._overdue).sort((a, b) => a.nextFollowUpDate.localeCompare(b.nextFollowUpDate));
    const dueToday = all.filter(f => f.nextFollowUpDate === today && open(f));
    const dueTomorrow = all.filter(f => f.nextFollowUpDate === tomorrow && open(f));
    const meetingReminders = all.filter(f => (f.stage === 'Meeting Scheduled' || f.purpose === 'Schedule Meeting' || f.purpose === 'Confirm Meeting') && f.nextFollowUpDate && f.nextFollowUpDate >= today && f.nextFollowUpDate <= tomorrow);
    const dueReminders = all.filter(f => f.reminderDate && f.reminderDate <= today && open(f));

    const items = [
      ...overdue.map(f => ({ tone: 'bad', text: `Overdue${f._daysRemaining <= -3 ? ' (missed)' : ''}: ${f.clientName || f.companyName} — ${f.purpose}`, date: f.nextFollowUpDate, id: f.id })),
      ...dueToday.map(f => ({ tone: 'warn', text: `Due today: ${f.clientName || f.companyName} — ${f.purpose}`, date: f.nextFollowUpDate, id: f.id })),
      ...dueTomorrow.map(f => ({ tone: 'info', text: `Due in 1 day: ${f.clientName || f.companyName} — ${f.purpose}`, date: f.nextFollowUpDate, id: f.id })),
      ...meetingReminders.map(f => ({ tone: 'info', text: `Meeting reminder: ${f.clientName || f.companyName}`, date: f.nextFollowUpDate, id: f.id })),
      ...dueReminders.map(f => ({ tone: 'info', text: `Reminder${f.reminderTime ? ' at ' + f.reminderTime : ''}: ${f.clientName || f.companyName} — ${f.subject || f.purpose}`, date: f.reminderDate, id: f.id })),
    ].slice(0, 10);

    return `
      <div class="panel" style="margin-bottom:18px">
        <h3>🔔 Notifications <span class="count-badge">${overdue.length + dueToday.length + dueTomorrow.length + dueReminders.length}</span></h3>
        <div class="notif-list">
          ${items.map(n => `
            <div class="notif-item" data-id="${n.id}">
              <span class="notif-badge ${n.tone}"></span>
              <span class="notif-text">${UI.escapeHtml(n.text)}</span>
              <span class="notif-time">${UI.fmtDate(n.date)}</span>
            </div>`).join('') || '<p class="empty-hint">All caught up — nothing needs attention right now.</p>'}
        </div>
      </div>`;
  },

  // ---------- TABLE VIEW ----------
  fuTh(field, label) {
    const { field: sf, dir } = this.state.fuSort;
    const arrow = sf === field ? (dir === 'asc' ? ' ↑' : ' ↓') : '';
    return `<th class="sortable fu-th" data-field="${field}">${label}${arrow}</th>`;
  },

  fuFilterSelect(field, label, options) {
    const val = this.state.fuFilters[field];
    return `<select class="fu-filter-select" data-field="${field}">
      <option value="">${label}: All</option>
      ${options.map(o => `<option value="${o}" ${o === val ? 'selected' : ''}>${o}</option>`).join('')}
    </select>`;
  },

  fuTableHtml() {
    const list = this.fuVisible();
    const total = list.length;
    const pageSize = this.state.fuPageSize;
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    if (this.state.fuPage > totalPages) this.state.fuPage = totalPages;
    const page = this.state.fuPage;
    const pageItems = list.slice((page - 1) * pageSize, page * pageSize);
    const f = this.state.fuFilters;

    return `
      <div class="filter-bar">
        <select class="fu-filter-select" data-field="companyId"><option value="">Client: All</option>${this.state.companies.map(c => `<option value="${c.id}" ${c.id === f.companyId ? 'selected' : ''}>${UI.escapeHtml(c.name) || c.id}</option>`).join('')}</select>
        ${this.fuFilterSelect('assignedTo', 'Salesperson', OPTIONS.assignedTo)}
        ${this.fuFilterSelect('stage', 'Stage', OPTIONS.fuStage)}
        ${this.fuFilterSelect('status', 'Status', OPTIONS.fuStatus)}
        ${this.fuFilterSelect('priority', 'Priority', OPTIONS.fuPriority)}
        ${this.fuFilterSelect('method', 'Method', OPTIONS.fuMethod)}
        ${this.fuFilterSelect('outcome', 'Outcome', OPTIONS.fuOutcome)}
        <input type="date" class="fu-filter-select" data-field="from" value="${f.from || ''}" title="Next follow-up from">
        <input type="date" class="fu-filter-select" data-field="to" value="${f.to || ''}" title="Next follow-up to">
        ${Object.values(f).some(Boolean) || this.state.fuQuickFilter ? '<button class="btn btn-ghost btn-sm" id="fu-clear-filters">Clear filters</button>' : ''}
      </div>
      <div class="export-bar">
        <input type="text" class="fu-search" id="fu-search-input" placeholder="Search client, contact, phone, email, ID..." value="${UI.escapeHtml(this.state.fuSearch)}">
        <button class="btn btn-ghost btn-sm" id="fu-export-xlsx">⬇ Excel</button>
        <button class="btn btn-ghost btn-sm" id="fu-export-csv">⬇ CSV</button>
        <button class="btn btn-ghost btn-sm" id="fu-export-pdf">⬇ PDF</button>
        <button class="btn btn-ghost btn-sm" id="fu-print">🖨 Print</button>
        <span class="count-badge">${total} follow-up${total === 1 ? '' : 's'}</span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr>
            <th>ID</th>
            ${this.fuTh('clientName', 'Client Name')}
            ${this.fuTh('companyName', 'Company')}
            ${this.fuTh('contactName', 'Contact Person')}
            <th>Job Title</th>
            <th>Phone</th>
            <th>Email</th>
            ${this.fuTh('assignedTo', 'Assigned Rep')}
            ${this.fuTh('stage', 'Stage')}
            ${this.fuTh('purpose', 'Purpose')}
            ${this.fuTh('method', 'Method')}
            ${this.fuTh('priority', 'Priority')}
            ${this.fuTh('status', 'Status')}
            ${this.fuTh('lastContactDate', 'Last Contact')}
            ${this.fuTh('nextFollowUpDate', 'Next Follow-up')}
            ${this.fuTh('_daysRemaining', 'Days Left')}
            <th>Next Action</th>
            ${this.fuTh('createdAt', 'Created')}
            ${this.fuTh('updatedAt', 'Updated')}
            <th class="print-hide"></th>
          </tr></thead>
          <tbody>
            ${pageItems.map(row => this.fuRow(row)).join('') || `<tr><td colspan="19" class="empty-cell">No follow-ups yet. <a href="#" id="fu-empty-add">Create your first one</a>.</td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <span>Page ${page} of ${totalPages} · ${total} total</span>
        <button id="fu-prev-page" ${page <= 1 ? 'disabled' : ''}>← Prev</button>
        <button id="fu-next-page" ${page >= totalPages ? 'disabled' : ''}>Next →</button>
      </div>
    `;
  },

  fuRow(f) {
    const days = f._daysRemaining;
    let daysClass = '', daysLabel = '—';
    if (f.nextFollowUpDate) {
      daysLabel = days === 0 ? 'Today' : days < 0 ? `${Math.abs(days)}d overdue` : `${days}d`;
      daysClass = days < 0 ? 'overdue' : days === 0 ? 'today' : days <= 2 ? 'soon' : '';
    }
    return `<tr class="${f._overdue ? 'row-overdue' : ''}">
      <td class="cell-sub">${f.id}</td>
      <td class="cell-main">${UI.escapeHtml(f.clientName || f.companyName) || '<em>Unnamed</em>'}</td>
      <td>${UI.escapeHtml(f.companyName) || '—'}</td>
      <td>${UI.escapeHtml(f.contactName) || '—'}</td>
      <td>${UI.escapeHtml(f.jobTitle) || '—'}</td>
      <td>${UI.escapeHtml(f.phone) || '—'}</td>
      <td>${UI.escapeHtml(f.email) || '—'}</td>
      <td>${UI.escapeHtml(f.assignedTo) || '—'}</td>
      <td><span class="chip stage-${(f.stage || '').replace(/\s/g, '')}">${f.stage || '—'}</span></td>
      <td>${UI.escapeHtml(f.purpose) || '—'}</td>
      <td>${UI.escapeHtml(f.method) || '—'}</td>
      <td><span class="chip prio-${f.priority}">${f.priority || '—'}</span></td>
      <td><span class="chip">${f.status || '—'}</span></td>
      <td>${UI.fmtDate(f.lastContactDate)}</td>
      <td class="${f._overdue ? 'text-danger' : ''}">${UI.fmtDate(f.nextFollowUpDate)}${f._overdue ? ' ⚠️' : ''}</td>
      <td><span class="fu-days ${daysClass}">${daysLabel}</span></td>
      <td>${UI.escapeHtml(f.nextAction) || '—'}</td>
      <td>${UI.fmtDate(f.createdAt)}</td>
      <td>${UI.fmtDate(f.updatedAt)}</td>
      <td class="row-actions print-hide">
        <button class="icon-btn fu-quick" data-id="${f.id}" title="Quick Follow-up">🔁</button>
        <button class="icon-btn fu-copy" data-id="${f.id}" title="Copy as New">📋</button>
        <button class="icon-btn fu-timeline" data-id="${f.id}" title="View Timeline">🕓</button>
        <button class="icon-btn fu-edit" data-id="${f.id}" title="Edit">✎</button>
        <button class="icon-btn fu-delete" data-id="${f.id}" title="Delete">🗑</button>
      </td>
    </tr>`;
  },

  wireFuTable(main) {
    const emptyAdd = document.getElementById('fu-empty-add');
    if (emptyAdd) emptyAdd.onclick = (e) => { e.preventDefault(); this.openFollowupForm(); };

    main.querySelectorAll('.fu-filter-select').forEach(sel => {
      sel.addEventListener('change', () => { this.state.fuFilters[sel.dataset.field] = sel.value; this.state.fuPage = 1; this.renderFollowupMgmt(); });
    });
    const clearBtn = document.getElementById('fu-clear-filters');
    if (clearBtn) clearBtn.onclick = () => {
      this.state.fuFilters = { companyId: '', assignedTo: '', stage: '', status: '', priority: '', method: '', outcome: '', from: '', to: '' };
      this.state.fuQuickFilter = ''; this.state.fuPage = 1;
      this.renderFollowupMgmt();
    };

    const searchInput = document.getElementById('fu-search-input');
    searchInput.addEventListener('input', (e) => {
      this.state.fuSearch = e.target.value;
      this.state.fuPage = 1;
      this.renderFollowupMgmt();
      const el = document.getElementById('fu-search-input');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });

    main.querySelectorAll('.fu-th').forEach(th => {
      th.addEventListener('click', () => {
        const fld = th.dataset.field;
        if (this.state.fuSort.field === fld) this.state.fuSort.dir = this.state.fuSort.dir === 'asc' ? 'desc' : 'asc';
        else this.state.fuSort = { field: fld, dir: 'asc' };
        this.renderFollowupMgmt();
      });
    });

    document.getElementById('fu-export-xlsx').onclick = () => this.exportFollowupsExcel();
    document.getElementById('fu-export-csv').onclick = () => this.exportFollowupsCSV();
    document.getElementById('fu-export-pdf').onclick = () => this.exportFollowupsPDF();
    document.getElementById('fu-print').onclick = () => this.printFollowups();

    main.querySelectorAll('.fu-quick').forEach(b => b.addEventListener('click', () => this.quickLogFollowup(b.dataset.id)));
    main.querySelectorAll('.fu-copy').forEach(b => b.addEventListener('click', () => this.copyFollowup(b.dataset.id)));
    main.querySelectorAll('.fu-timeline').forEach(b => b.addEventListener('click', () => this.openFollowupTimeline(b.dataset.id)));
    main.querySelectorAll('.fu-edit').forEach(b => b.addEventListener('click', () => this.openFollowupForm(b.dataset.id)));
    main.querySelectorAll('.fu-delete').forEach(b => b.addEventListener('click', () => this.deleteFollowup(b.dataset.id)));

    const prevBtn = document.getElementById('fu-prev-page');
    const nextBtn = document.getElementById('fu-next-page');
    if (prevBtn) prevBtn.onclick = () => { if (this.state.fuPage > 1) { this.state.fuPage--; this.renderFollowupMgmt(); } };
    if (nextBtn) nextBtn.onclick = () => { this.state.fuPage++; this.renderFollowupMgmt(); };
  },

  // ---------- ADD / EDIT FORM ----------
  openFollowupForm(id, prefillData) {
    const editing = !!id;
    const base = editing ? this.state.followups.find(x => x.id === id) : { ...blankFollowup(), ...(prefillData || {}) };
    if (!base) return;
    const f = (() => {
      const nf = { ...base };
      if (!editing && prefillData) { nf.id = uid('F'); nf.createdAt = nowISO(); nf.updatedAt = nowISO(); nf.version = 1; nf.timeline = []; }
      return nf;
    })();

    const contactOptions = (companyId, contactId) => this.state.contacts.filter(c => c.companyId === companyId).map(c => `<option value="${c.id}" ${c.id === contactId ? 'selected' : ''}>${UI.escapeHtml(c.name)}</option>`).join('');

    UI.openModal(`
      <div class="modal">
        <h3>${editing ? 'Edit Follow-up' : 'New Follow-up'}${editing ? `<span class="ver-badge">Version ${f.version || 1}</span>` : ''}</h3>
        <div id="fu-dup-warning"></div>
        <form id="followup-mgmt-form" class="form-grid">
          <label>Company*<select name="companyId" id="fu-company-select" required><option value="">— Select —</option>${this.state.companies.map(c => `<option value="${c.id}" ${c.id === f.companyId ? 'selected' : ''}>${UI.escapeHtml(c.name) || c.id}</option>`).join('')}</select></label>
          <label>Client Name<input name="clientName" id="fu-client-name" value="${UI.escapeHtml(f.clientName || f.companyName)}" placeholder="Auto-filled from company"></label>
          <label>Contact Person<select name="contactId" id="fu-contact-select"><option value="">— None / Manual —</option>${contactOptions(f.companyId, f.contactId)}</select></label>
          <label>Job Title<input name="jobTitle" id="fu-jobtitle" value="${UI.escapeHtml(f.jobTitle)}"></label>
          <label>Phone Number<input name="phone" id="fu-phone" value="${UI.escapeHtml(f.phone)}"></label>
          <label>Email<input type="email" name="email" id="fu-email" value="${UI.escapeHtml(f.email)}"></label>
          <label>Assigned Salesperson<select name="assignedTo">${UI.optionsHtml(OPTIONS.assignedTo, f.assignedTo)}</select></label>
          <label>Opportunity Stage<select name="stage">${OPTIONS.fuStage.map(o => `<option ${o === f.stage ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
          <label>Follow-up Purpose<select name="purpose" id="fu-purpose-select">${OPTIONS.fuPurpose.map(o => `<option ${o === f.purpose ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
          <label>Follow-up Method<select name="method">${OPTIONS.fuMethod.map(o => `<option ${o === f.method ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
          <label>Priority<select name="priority">${OPTIONS.fuPriority.map(o => `<option ${o === f.priority ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
          <label>Status<select name="status">${OPTIONS.fuStatus.map(o => `<option ${o === f.status ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
          <label>Outcome<select name="outcome"><option value="">—</option>${OPTIONS.fuOutcome.map(o => `<option ${o === f.outcome ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
          <label class="span-2">Subject<input name="subject" value="${UI.escapeHtml(f.subject)}" placeholder="Short summary of this follow-up"></label>
          <label class="span-2">Detailed Notes<textarea name="notes" rows="3" placeholder="Context, discussion points, anything useful next time...">${UI.escapeHtml(f.notes)}</textarea></label>
          <label class="span-2">Next Action<input name="nextAction" value="${UI.escapeHtml(f.nextAction)}" placeholder="e.g. Send updated proposal by Thursday"></label>
          <label>Last Contact Date<input type="date" name="lastContactDate" value="${f.lastContactDate || ''}"></label>
          <label>Next Follow-up Date<input type="date" name="nextFollowUpDate" value="${f.nextFollowUpDate || ''}"></label>
          <label>Reminder Date<input type="date" name="reminderDate" value="${f.reminderDate || ''}"></label>
          <label>Reminder Time<input type="time" name="reminderTime" value="${f.reminderTime || ''}"></label>
          <label>Estimated Deal Value ($)<input type="number" name="dealValue" value="${f.dealValue || 0}"></label>
          <label>Probability %<input type="number" min="0" max="100" name="probability" value="${f.probability || 0}"></label>
          <label>Expected Closing Date<input type="date" name="expectedClosingDate" value="${f.expectedClosingDate || ''}"></label>
          <label class="span-2">Attachments<input type="file" id="fu-attachments" multiple></label>
          <label class="span-2">Tags<input name="tags" value="${UI.escapeHtml(f.tags)}" placeholder="comma, separated, tags"></label>
          <label class="span-2">Internal Notes<textarea name="internalNotes" rows="2" placeholder="Only visible to your team">${UI.escapeHtml(f.internalNotes)}</textarea></label>
          <div class="modal-actions span-2">
            <button type="button" class="btn btn-ghost" id="cancel-fumform">Cancel</button>
            <button type="submit" class="btn btn-primary">${editing ? 'Save Changes' : 'Create Follow-up'}</button>
          </div>
        </form>
      </div>
    `);

    const checkDup = () => {
      const companyId = document.getElementById('fu-company-select').value;
      const purpose = document.getElementById('fu-purpose-select').value;
      const warnEl = document.getElementById('fu-dup-warning');
      if (!editing && companyId && purpose) {
        const dup = this.fuFindDuplicate(companyId, purpose, f.id);
        warnEl.innerHTML = dup ? `<div class="dup-warning">⚠️ An open follow-up for this client with the same purpose already exists (created ${UI.fmtDate(dup.createdAt)}). You can still save — just double-check it isn't a duplicate.</div>` : '';
      } else warnEl.innerHTML = '';
    };
    checkDup();

    document.getElementById('fu-company-select').addEventListener('change', (e) => {
      const company = this.state.companies.find(c => c.id === e.target.value);
      const clientNameInput = document.getElementById('fu-client-name');
      if (company && clientNameInput.dataset.auto !== 'false') { clientNameInput.value = company.name; clientNameInput.dataset.auto = 'true'; }
      document.getElementById('fu-contact-select').innerHTML = `<option value="">— None / Manual —</option>${contactOptions(e.target.value, '')}`;
      checkDup();
    });
    document.getElementById('fu-client-name').addEventListener('input', (e) => { e.target.dataset.auto = 'false'; });
    document.getElementById('fu-purpose-select').addEventListener('change', checkDup);

    document.getElementById('fu-contact-select').addEventListener('change', (e) => {
      const contact = this.state.contacts.find(c => c.id === e.target.value);
      if (contact) {
        document.getElementById('fu-jobtitle').value = contact.jobTitle || '';
        document.getElementById('fu-phone').value = contact.phone || '';
        document.getElementById('fu-email').value = contact.email || '';
        const clientNameInput = document.getElementById('fu-client-name');
        if (clientNameInput.dataset.auto !== 'false') { clientNameInput.value = contact.name; clientNameInput.dataset.auto = 'true'; }
      }
    });

    document.getElementById('cancel-fumform').onclick = () => UI.closeModal();
    document.getElementById('followup-mgmt-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const before = editing ? { ...f } : null;
      const updated = { ...f };
      for (const [k, v] of fd.entries()) updated[k] = v;

      const fileInput = document.getElementById('fu-attachments');
      if (fileInput && fileInput.files.length) {
        updated.attachments = [...(updated.attachments || []), ...[...fileInput.files].map(file => file.name)];
      }
      const company = this.state.companies.find(c => c.id === updated.companyId);
      updated.companyName = company ? company.name : '';
      const contact = this.state.contacts.find(c => c.id === updated.contactId);
      if (contact) updated.contactName = contact.name;
      updated.dealValue = Number(updated.dealValue) || 0;
      updated.probability = Math.max(0, Math.min(100, Number(updated.probability) || 0));

      if (!editing) {
        const dup = this.fuFindDuplicate(updated.companyId, updated.purpose, updated.id);
        if (dup) {
          const proceed = await UI.confirm('An open follow-up for this client with the same purpose already exists. Create a duplicate anyway?', { danger: false, confirmLabel: 'Create Anyway' });
          if (!proceed) return;
        }
      }

      updated.updatedAt = nowISO();
      updated.version = editing ? (Number(f.version) || 1) + 1 : 1;
      if (!editing) updated.createdAt = updated.createdAt || nowISO();
      updated.timeline = updated.timeline || [];
      if (!editing) {
        updated.timeline = [...updated.timeline, { date: nowISO(), user: updated.assignedTo || 'System', type: 'Created', notes: `Follow-up created — ${updated.purpose}` }];
      } else {
        const evNotes = [];
        if (before.stage !== updated.stage) evNotes.push(`Stage: ${before.stage} → ${updated.stage}`);
        if (before.status !== updated.status) evNotes.push(`Status: ${before.status} → ${updated.status}`);
        if (updated.outcome && before.outcome !== updated.outcome) evNotes.push(`Outcome: ${updated.outcome}`);
        if (evNotes.length) updated.timeline = [...updated.timeline, { date: nowISO(), user: updated.assignedTo || 'System', type: 'Update', notes: evNotes.join(' · ') }];
      }

      await DB.followups.put(updated);
      const idx = this.state.followups.findIndex(x => x.id === updated.id);
      if (idx >= 0) this.state.followups[idx] = updated; else this.state.followups.unshift(updated);
      const changes = editing ? diffRecords(before, updated, FOLLOWUP_FIELD_LABELS) : [];
      await this.logChange({
        action: editing ? 'update' : 'create', entityType: 'Followup', entityId: updated.id,
        entityName: updated.clientName || updated.companyName || updated.id, changes, snapshot: before, fullData: { ...updated }
      });
      UI.toast(`${updated.clientName || updated.companyName || 'Follow-up'} saved`, 'success');
      UI.closeModal();
      this.route('followupmgmt');
    });
  },

  // ---------- QUICK FOLLOW-UP / COPY / TIMELINE / DELETE ----------
  quickLogFollowup(id) {
    const f = this.state.followups.find(x => x.id === id);
    if (!f) return;
    UI.openModal(`
      <div class="modal modal-sm">
        <h3>Quick Follow-up — ${UI.escapeHtml(f.clientName || f.companyName) || 'Record'}</h3>
        <p class="modal-msg">Last contact: ${UI.fmtDate(f.lastContactDate)} · Next action: ${UI.escapeHtml(f.nextAction) || '—'}</p>
        <form id="quick-fu-form">
          <label class="fu-form-label">What happened?*
            <textarea id="qfu-notes" rows="3" required placeholder="e.g. Called, discussed pricing, will send proposal tomorrow"></textarea>
          </label>
          <label class="fu-form-label" style="margin-top:10px">Outcome
            <select id="qfu-outcome"><option value="">—</option>${OPTIONS.fuOutcome.map(o => `<option ${o === f.outcome ? 'selected' : ''}>${o}</option>`).join('')}</select>
          </label>
          <label class="fu-form-label" style="margin-top:10px">Next Follow-up Date
            <input type="date" id="qfu-next" value="${f.nextFollowUpDate || ''}">
          </label>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="cancel-qfu">Cancel</button>
            <button type="submit" class="btn btn-primary">Log Follow-up</button>
          </div>
        </form>
        ${(f.timeline || []).length ? `
        <div class="fu-history">
          <h4>Recent activity</h4>
          <ul class="fu-history-list">
            ${[...f.timeline].reverse().slice(0, 5).map(ev => `<li><span class="fu-history-date">${UI.fmtDate(ev.date)}</span><span class="fu-history-text">${UI.escapeHtml(ev.notes)}</span></li>`).join('')}
          </ul>
        </div>` : ''}
      </div>
    `);
    document.getElementById('cancel-qfu').onclick = () => UI.closeModal();
    document.getElementById('quick-fu-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const notes = document.getElementById('qfu-notes').value.trim();
      const outcome = document.getElementById('qfu-outcome').value;
      const next = document.getElementById('qfu-next').value;
      if (!notes) return;
      const before = { ...f };
      f.timeline = [...(f.timeline || []), { date: nowISO(), user: f.assignedTo || 'You', type: f.method || 'Follow-up', notes }];
      f.lastContactDate = this.fuToday();
      if (outcome) f.outcome = outcome;
      f.nextFollowUpDate = next || '';
      f.status = next ? 'Rescheduled' : 'Completed';
      f.updatedAt = nowISO();
      f.version = (Number(f.version) || 1) + 1;
      await DB.followups.put(f);
      await this.logChange({
        action: 'followup', entityType: 'Followup', entityId: f.id, entityName: f.clientName || f.companyName,
        message: `Logged follow-up with ${f.clientName || f.companyName}: ${notes}`, snapshot: before, fullData: { ...f }
      });
      UI.toast('Follow-up logged', 'success');
      UI.closeModal();
      this.route('followupmgmt');
    });
  },

  copyFollowup(id) {
    const f = this.state.followups.find(x => x.id === id);
    if (!f) return;
    const clone = { ...f, nextFollowUpDate: '', reminderDate: '', reminderTime: '', lastContactDate: this.fuToday(), status: 'Scheduled', outcome: '', timeline: [] };
    delete clone.id;
    this.openFollowupForm(null, clone);
    UI.toast('Copied previous follow-up — review the details and save', 'info');
  },

  openFollowupTimeline(id) {
    const f = this.state.followups.find(x => x.id === id);
    if (!f) return;
    const events = [...(f.timeline || [])].sort((a, b) => new Date(b.date) - new Date(a.date));
    UI.openModal(`
      <div class="modal">
        <h3>Timeline — ${UI.escapeHtml(f.clientName || f.companyName) || 'Follow-up'}</h3>
        <p class="modal-msg">${events.length} activity ${events.length === 1 ? 'entry' : 'entries'} · Stage: <strong>${f.stage}</strong> · Status: <strong>${f.status}</strong></p>
        <div class="tl-list">
          ${events.map(ev => `
            <div class="tl-item">
              <div class="tl-dot"></div>
              <div class="tl-body">
                <div class="tl-head"><span>${UI.escapeHtml(ev.type || 'Activity')}</span><span class="tl-meta">${new Date(ev.date).toLocaleString()}</span></div>
                <div class="tl-meta">${UI.escapeHtml(ev.user || '')}</div>
                <div class="tl-notes">${UI.escapeHtml(ev.notes || '')}</div>
              </div>
            </div>`).join('') || '<p class="empty-hint">No activity logged yet.</p>'}
        </div>
        <div class="modal-actions"><button class="btn btn-ghost" id="close-tl">Close</button></div>
      </div>
    `);
    document.getElementById('close-tl').onclick = () => UI.closeModal();
  },

  async deleteFollowup(id) {
    const f = this.state.followups.find(x => x.id === id);
    const ok = await UI.confirm('Delete this follow-up permanently?', { requirePassword: true });
    if (!ok) return;
    await DB.followups.delete(id);
    this.state.followups = this.state.followups.filter(x => x.id !== id);
    await this.logChange({ action: 'delete', entityType: 'Followup', entityId: id, entityName: f?.clientName || f?.companyName || id, snapshot: f || null, fullData: f ? { ...f } : null });
    UI.toast('Follow-up deleted', 'success');
    this.route('followupmgmt');
  },

  // ---------- CALENDAR VIEW ----------
  fuCalendarHtml() {
    const d = this.state.fuCalendarDate;
    const year = d.getFullYear(), month = d.getMonth();
    const first = new Date(year, month, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = this.fuToday();
    const all = this.fuAll();
    const byDate = {};
    all.forEach(f => { if (f.nextFollowUpDate) (byDate[f.nextFollowUpDate] = byDate[f.nextFollowUpDate] || []).push(f); });
    const dow = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    let cells = '';
    for (let i = 0; i < startDow; i++) cells += `<div class="calendar-cell empty"></div>`;
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const items = byDate[dateStr] || [];
      cells += `<div class="calendar-cell ${dateStr === today ? 'today' : ''}" data-date="${dateStr}">
        <div class="calendar-daynum">${day}</div>
        ${items.slice(0, 3).map(f => `<div class="calendar-event ${f._overdue ? 'overdue-ev' : ''}" title="${UI.escapeHtml(f.clientName || f.companyName)} — ${UI.escapeHtml(f.purpose)}">${UI.escapeHtml(f.clientName || f.companyName) || '—'}</div>`).join('')}
        ${items.length > 3 ? `<div class="calendar-more">+${items.length - 3} more</div>` : ''}
      </div>`;
    }
    return `
      <div class="calendar-wrap">
        <div class="calendar-head">
          <h3>${first.toLocaleString(undefined, { month: 'long', year: 'numeric' })}</h3>
          <div class="calendar-nav">
            <button class="btn btn-ghost btn-sm" id="cal-prev">← Prev</button>
            <button class="btn btn-ghost btn-sm" id="cal-today">Today</button>
            <button class="btn btn-ghost btn-sm" id="cal-next">Next →</button>
          </div>
        </div>
        <div class="calendar-grid">
          ${dow.map(x => `<div class="calendar-dow">${x}</div>`).join('')}
          ${cells}
        </div>
      </div>`;
  },

  wireFuCalendar(main) {
    const d = this.state.fuCalendarDate;
    document.getElementById('cal-prev').onclick = () => { this.state.fuCalendarDate = new Date(d.getFullYear(), d.getMonth() - 1, 1); this.renderFollowupMgmt(); };
    document.getElementById('cal-next').onclick = () => { this.state.fuCalendarDate = new Date(d.getFullYear(), d.getMonth() + 1, 1); this.renderFollowupMgmt(); };
    document.getElementById('cal-today').onclick = () => { this.state.fuCalendarDate = new Date(); this.renderFollowupMgmt(); };
    main.querySelectorAll('.calendar-cell[data-date]').forEach(cell => {
      cell.addEventListener('click', () => {
        const date = cell.dataset.date;
        this.state.fuFilters.from = date; this.state.fuFilters.to = date;
        this.state.fuQuickFilter = ''; this.state.fuPage = 1; this.state.fuView = 'table';
        this.renderFollowupMgmt();
      });
    });
  },

  // ---------- ANALYTICS VIEW ----------
  fuAnalyticsHtml() {
    return `
      <div class="stat-strip" id="fu-stat-strip"></div>
      <div class="chart-grid">
        <div class="panel"><h3>Follow-ups per Month</h3><canvas id="fu-chart-month" height="200"></canvas></div>
        <div class="panel"><h3>Follow-ups per Salesperson</h3><canvas id="fu-chart-rep" height="200"></canvas></div>
        <div class="panel"><h3>Win Rate</h3><canvas id="fu-chart-win" height="200"></canvas></div>
        <div class="panel"><h3>Opportunity Pipeline</h3><canvas id="fu-chart-pipeline" height="200"></canvas></div>
        <div class="panel"><h3>Meetings vs Closed Deals</h3><canvas id="fu-chart-meetvsclose" height="200"></canvas></div>
        <div class="panel"><h3>Lost Opportunities by Reason</h3><canvas id="fu-chart-lost" height="200"></canvas></div>
      </div>
    `;
  },

  fuBarChart(canvasId, labels, data, colorFn) {
    Charts._destroy(canvasId);
    const pal = Charts._palette();
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    Charts._instances[canvasId] = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [{ data, backgroundColor: labels.map((l, i) => (colorFn && colorFn(l)) || pal.series[i % pal.series.length]), borderRadius: 6 }] },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: pal.text, font: { size: 10 } } },
          y: { grid: { color: pal.grid }, ticks: { color: pal.text, precision: 0 } }
        }
      }
    });
  },

  renderFuAnalyticsCharts() {
    const all = this.fuAll();
    const total = all.length;
    const completed = all.filter(f => f.status === 'Completed').length;
    const completionRate = total ? Math.round((completed / total) * 100) : 0;
    const closedRecords = all.filter(f => ['Won', 'Lost'].includes(f.stage) && f.createdAt);
    const avgDays = closedRecords.length ? Math.round(closedRecords.reduce((s, f) => s + Math.max(0, (new Date(f.updatedAt) - new Date(f.createdAt)) / 86400000), 0) / closedRecords.length) : 0;
    const won = all.filter(f => f.stage === 'Won').length;
    const lost = all.filter(f => f.stage === 'Lost').length;
    const winRate = (won + lost) ? Math.round((won / (won + lost)) * 100) : 0;

    const stripEl = document.getElementById('fu-stat-strip');
    if (stripEl) stripEl.innerHTML = `
      <div class="stat-box"><div class="stat-val">${completionRate}%</div><div class="stat-lbl">Completion Rate</div></div>
      <div class="stat-box"><div class="stat-val">${avgDays}d</div><div class="stat-lbl">Avg. Days to Close</div></div>
      <div class="stat-box"><div class="stat-val">${winRate}%</div><div class="stat-lbl">Win Rate</div></div>
      <div class="stat-box"><div class="stat-val">${total}</div><div class="stat-lbl">Total Follow-ups</div></div>
    `;

    const months = [...Array(6)].map((_, i) => { const dd = new Date(); dd.setMonth(dd.getMonth() - (5 - i)); return dd; });
    const labels = months.map(dd => dd.toLocaleString(undefined, { month: 'short' }));
    const createdM = months.map(dd => all.filter(f => f.createdAt && new Date(f.createdAt).getMonth() === dd.getMonth() && new Date(f.createdAt).getFullYear() === dd.getFullYear()).length);
    const completedM = months.map(dd => all.filter(f => f.status === 'Completed' && f.updatedAt && new Date(f.updatedAt).getMonth() === dd.getMonth() && new Date(f.updatedAt).getFullYear() === dd.getFullYear()).length);
    Charts.renderMonthlyTrend('fu-chart-month', labels, createdM, completedM);

    const repCounts = this.countBy(all, 'assignedTo', OPTIONS.assignedTo);
    this.fuBarChart('fu-chart-rep', Object.keys(repCounts), Object.values(repCounts));

    Charts.renderLeadSources('fu-chart-win', { Won: won, Lost: lost, Open: Math.max(0, total - won - lost) });

    const stageCounts = this.countBy(all, 'stage', OPTIONS.fuStage);
    this.fuBarChart('fu-chart-pipeline', Object.keys(stageCounts), Object.values(stageCounts), (l) => l === 'Lost' ? '#E0654F' : l === 'Won' ? '#5FCB93' : undefined);

    const meetings = all.filter(f => f.stage === 'Meeting Scheduled' || f.purpose === 'Schedule Meeting' || f.purpose === 'Confirm Meeting').length;
    this.fuBarChart('fu-chart-meetvsclose', ['Meetings Scheduled', 'Deals Won'], [meetings, won]);

    const lostOutcomes = this.countBy(all.filter(f => f.stage === 'Lost'), 'outcome', []);
    const lostLabels = Object.keys(lostOutcomes).length ? Object.keys(lostOutcomes) : ['No data'];
    const lostData = Object.keys(lostOutcomes).length ? Object.values(lostOutcomes) : [0];
    this.fuBarChart('fu-chart-lost', lostLabels, lostData);
  },

  // ---------- EXPORT / PRINT ----------
  fuExportRows(list) {
    const headers = ['Follow-up ID', 'Client Name', 'Company Name', 'Contact Person', 'Job Title', 'Phone Number', 'Email', 'Assigned Sales Representative', 'Opportunity Stage', 'Follow-up Purpose', 'Follow-up Method', 'Priority', 'Status', 'Last Contact Date', 'Next Follow-up Date', 'Days Remaining', 'Next Action', 'Created Date', 'Last Updated'];
    const rows = list.map(f => [
      f.id, f.clientName || f.companyName, f.companyName, f.contactName, f.jobTitle, f.phone, f.email,
      f.assignedTo, f.stage, f.purpose, f.method, f.priority, f.status,
      UI.fmtDate(f.lastContactDate), UI.fmtDate(f.nextFollowUpDate),
      f._daysRemaining == null ? '' : f._daysRemaining, f.nextAction, UI.fmtDate(f.createdAt), UI.fmtDate(f.updatedAt)
    ]);
    return { headers, rows };
  },

  exportFollowupsExcel() {
    const { headers, rows } = this.fuExportRows(this.fuVisible());
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Follow-ups');
    const fname = `Followups_${new Date().toISOString().slice(0, 10)}.xlsx`;
    XLSX.writeFile(wb, fname);
    this.logChange({ action: 'export', entityType: 'Data', entityName: fname, message: `Exported Follow-up Management data to ${fname}` });
    UI.toast('Exported to Excel', 'success');
  },

  exportFollowupsCSV() {
    const { headers, rows } = this.fuExportRows(this.fuVisible());
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    const csv = XLSX.utils.sheet_to_csv(ws);
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `Followups_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    UI.toast('Exported to CSV', 'success');
  },

  exportFollowupsPDF() {
    const { headers, rows } = this.fuExportRows(this.fuVisible());
    if (!window.jspdf) { UI.toast('PDF library failed to load — check your connection', 'error'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape' });
    doc.setFontSize(14);
    doc.text('Follow-up Management — Export', 14, 14);
    doc.autoTable({ head: [headers], body: rows, startY: 20, styles: { fontSize: 7 } });
    doc.save(`Followups_${new Date().toISOString().slice(0, 10)}.pdf`);
    UI.toast('Exported to PDF', 'success');
  },

  printFollowups() {
    window.print();
  },

  // ---------- HISTORY / ACTIVITY LOG ----------
  renderHistory() {
    const f = this.state.historyFilter;
    const list = this.filteredActivities();
    const rangeLabels = { all: 'All Time', today: 'Today', yesterday: 'Yesterday', '7d': 'Last 7 Days', '30d': 'Last 30 Days', month: 'This Month' };
    const main = document.getElementById('main');
    main.innerHTML = `
      <div class="view-header">
        <h1>History</h1>
        <p class="sub">${list.length} of ${this.state.activities.length} events — every add, edit, delete, import and export is tracked automatically.</p>
      </div>
      <div class="filter-bar">
        <input type="text" id="history-search" class="filter-select" style="min-width:220px" placeholder="Search history..." value="${UI.escapeHtml(f.search)}">
        <select class="filter-select" id="history-range">
          ${Object.entries(rangeLabels).map(([r, label]) => `<option value="${r}" ${f.range === r ? 'selected' : ''}>${label}</option>`).join('')}
        </select>
        <select class="filter-select" id="history-entity">
          <option value="">Entity: All</option>
          ${['Company', 'Contact', 'Task', 'Data', 'Settings'].map(t => `<option value="${t}" ${f.entityType === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
        <select class="filter-select" id="history-action">
          <option value="">Action: All</option>
          ${['create', 'update', 'delete', 'restore', 'undo', 'import', 'export', 'settings', 'followup'].map(a => `<option value="${a}" ${f.action === a ? 'selected' : ''}>${this.actionLabel(a)}</option>`).join('')}
        </select>
        ${(f.search || f.entityType || f.action || f.range !== 'all') ? '<button class="btn btn-ghost btn-sm" id="history-clear">Clear filters</button>' : ''}
      </div>
      <div class="history-list">
        ${list.map(a => this.historyCard(a)).join('') || '<p class="empty-hint">No activity matches these filters.</p>'}
      </div>
    `;
    document.getElementById('history-search').addEventListener('input', (e) => { this.state.historyFilter.search = e.target.value; this.renderHistory(); });
    document.getElementById('history-range').addEventListener('change', (e) => { this.state.historyFilter.range = e.target.value; this.renderHistory(); });
    document.getElementById('history-entity').addEventListener('change', (e) => { this.state.historyFilter.entityType = e.target.value; this.renderHistory(); });
    document.getElementById('history-action').addEventListener('change', (e) => { this.state.historyFilter.action = e.target.value; this.renderHistory(); });
    const clearBtn = document.getElementById('history-clear');
    if (clearBtn) clearBtn.onclick = () => { this.state.historyFilter = { range: 'all', entityType: '', action: '', search: '' }; this.renderHistory(); };
    main.querySelectorAll('.hist-undo').forEach(b => b.addEventListener('click', () => this.undoActivity(b.dataset.id)));
    main.querySelectorAll('.hist-restore').forEach(b => b.addEventListener('click', () => this.restoreActivity(b.dataset.id)));
  },

  filteredActivities() {
    const f = this.state.historyFilter;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return this.state.activities.filter(a => {
      const ts = new Date(a.timestamp);
      if (f.range === 'today' && ts < today) return false;
      if (f.range === 'yesterday') {
        const y0 = new Date(today); y0.setDate(y0.getDate() - 1);
        if (!(ts >= y0 && ts < today)) return false;
      }
      if (f.range === '7d') { const d = new Date(today); d.setDate(d.getDate() - 7); if (ts < d) return false; }
      if (f.range === '30d') { const d = new Date(today); d.setDate(d.getDate() - 30); if (ts < d) return false; }
      if (f.range === 'month') { const now = new Date(); if (ts.getMonth() !== now.getMonth() || ts.getFullYear() !== now.getFullYear()) return false; }
      if (f.entityType && a.entityType !== f.entityType) return false;
      if (f.action && a.action !== f.action) return false;
      if (f.search) {
        const hay = `${a.entityName} ${a.message} ${(a.changes || []).map(c => `${c.field} ${c.old} ${c.new}`).join(' ')}`.toLowerCase();
        if (!hay.includes(f.search.toLowerCase())) return false;
      }
      return true;
    });
  },

  actionLabel(a) {
    return { create: 'Created', update: 'Updated', delete: 'Deleted', restore: 'Restored',
      undo: 'Undone', import: 'Imported', export: 'Exported', settings: 'Settings', followup: 'Follow-up Logged' }[a] || a;
  },

  fullDataFields(entityType, data) {
    if (!data) return [];
    const labelMaps = { Company: COMPANY_FIELD_LABELS, Contact: CONTACT_FIELD_LABELS, Task: TASK_FIELD_LABELS };
    const labels = labelMaps[entityType] || {};
    const skip = new Set(['id', 'companyId', '_relatedContacts', 'version', 'createdAt', 'updatedAt']);
    const keys = Object.keys(labels).length ? Object.keys(labels) : Object.keys(data).filter(k => !skip.has(k));
    return keys.filter(k => !skip.has(k)).map(k => ({
      label: labels[k] || k,
      value: data[k] === '' || data[k] == null ? '—' : (typeof data[k] === 'boolean' ? (data[k] ? 'Yes' : 'No') : String(data[k]))
    }));
  },

  historyCard(a) {
    const d = new Date(a.timestamp);
    const dateStr = d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
    const timeStr = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    const canUndo = !a.undone && (a.action === 'update' || a.action === 'create') && a.snapshot !== undefined && (a.action !== 'create' || a.entityId);
    const canRestore = !a.undone && a.action === 'delete' && !!a.snapshot;
    return `<div class="history-card">
      <div class="hist-time"><div>${dateStr}</div><div class="hist-time-sub">${timeStr}</div></div>
      <div class="hist-body">
        <div class="hist-head">
          <span class="chip hist-badge badge-${a.action}">${this.actionLabel(a.action)}</span>
          <span class="hist-entity">${UI.escapeHtml(a.entityType || '')}${a.entityName ? ': ' + UI.escapeHtml(a.entityName) : ''}</span>
          ${a.undone ? '<span class="chip">Reverted</span>' : ''}
        </div>
        ${a.changes && a.changes.length ? `<div class="hist-diffs">${a.changes.map(c => `
          <div class="hist-diff"><span class="hist-diff-field">${UI.escapeHtml(c.label)}</span><span class="hist-diff-old">${UI.escapeHtml(c.old) || '—'}</span><span class="hist-diff-arrow">→</span><span class="hist-diff-new">${UI.escapeHtml(c.new) || '—'}</span></div>`).join('')}</div>`
          : `<div class="hist-msg">${UI.escapeHtml(a.message)}</div>`}
        ${a.fullData ? `<details class="hist-fulldata">
          <summary>View full data</summary>
          <div class="hist-fulldata-grid">
            ${this.fullDataFields(a.entityType, a.fullData).map(f => `
              <div class="hist-fulldata-row"><span class="hist-fulldata-label">${UI.escapeHtml(f.label)}</span><span class="hist-fulldata-value">${UI.escapeHtml(f.value)}</span></div>`).join('')}
          </div>
        </details>` : ''}
        <div class="hist-foot">
          <span class="hist-id">ID: ${UI.escapeHtml(a.entityId || a.id)}</span>
          ${canUndo ? `<button class="btn btn-ghost btn-sm hist-undo" data-id="${a.id}">Undo</button>` : ''}
          ${canRestore ? `<button class="btn btn-ghost btn-sm hist-restore" data-id="${a.id}">Restore</button>` : ''}
        </div>
      </div>
    </div>`;
  },

  async removeEntity(entityType, id) {
    if (entityType === 'Company') {
      await DB.companies.delete(id);
      this.state.companies = this.state.companies.filter(x => x.id !== id);
    } else if (entityType === 'Contact') {
      await DB.contacts.delete(id);
      this.state.contacts = this.state.contacts.filter(x => x.id !== id);
    } else if (entityType === 'Task') {
      await DB.tasks.delete(id);
      this.state.tasks = this.state.tasks.filter(x => x.id !== id);
    }
  },

  async restoreEntity(entityType, snapshot) {
    if (!snapshot) return;
    if (entityType === 'Company') {
      const { _relatedContacts, ...company } = snapshot;
      await DB.companies.put(company);
      const idx = this.state.companies.findIndex(x => x.id === company.id);
      if (idx >= 0) this.state.companies[idx] = company; else this.state.companies.unshift(company);
      if (_relatedContacts && _relatedContacts.length) {
        for (const rc of _relatedContacts) {
          await DB.contacts.put(rc);
          const cidx = this.state.contacts.findIndex(x => x.id === rc.id);
          if (cidx >= 0) this.state.contacts[cidx] = rc; else this.state.contacts.unshift(rc);
        }
      }
    } else if (entityType === 'Contact') {
      await DB.contacts.put(snapshot);
      const idx = this.state.contacts.findIndex(x => x.id === snapshot.id);
      if (idx >= 0) this.state.contacts[idx] = snapshot; else this.state.contacts.unshift(snapshot);
    } else if (entityType === 'Task') {
      await DB.tasks.put(snapshot);
      const idx = this.state.tasks.findIndex(x => x.id === snapshot.id);
      if (idx >= 0) this.state.tasks[idx] = snapshot; else this.state.tasks.unshift(snapshot);
    }
  },

  async undoActivity(activityId) {
    const act = this.state.activities.find(a => a.id === activityId);
    if (!act || act.undone) return;
    try {
      if (act.action === 'create') {
        await this.removeEntity(act.entityType, act.entityId);
      } else if (act.action === 'update' && act.snapshot) {
        await this.restoreEntity(act.entityType, act.snapshot);
      } else {
        return;
      }
      act.undone = true;
      await DB.activities.put(act);
      await this.logChange({
        action: 'undo', entityType: act.entityType, entityId: act.entityId, entityName: act.entityName,
        message: `Reverted change to ${act.entityType} "${act.entityName}"`
      });
      UI.toast('Change undone', 'success');
      this.route('history');
    } catch (err) {
      console.error(err);
      UI.toast('Could not undo that change', 'error');
    }
  },

  async restoreActivity(activityId) {
    const act = this.state.activities.find(a => a.id === activityId);
    if (!act || act.undone || act.action !== 'delete' || !act.snapshot) return;
    try {
      await this.restoreEntity(act.entityType, act.snapshot);
      act.undone = true;
      await DB.activities.put(act);
      await this.logChange({
        action: 'restore', entityType: act.entityType, entityId: act.entityId, entityName: act.entityName,
        message: `Restored ${act.entityType} "${act.entityName}"`
      });
      UI.toast(`${act.entityType} restored`, 'success');
      this.route('history');
    } catch (err) {
      console.error(err);
      UI.toast('Could not restore that record', 'error');
    }
  },

  // ---------- TEAM MEMBERS ----------
  async addTeamMember(rawName) {
    const name = (rawName || '').trim();
    if (!name) { UI.toast('Enter a name first', 'error'); return; }
    if (OPTIONS.assignedTo.some(n => n.toLowerCase() === name.toLowerCase())) {
      UI.toast('That name is already on the team', 'error');
      return;
    }
    OPTIONS.assignedTo.push(name);
    await DB.setSetting('team', OPTIONS.assignedTo.slice());
    await this.logChange({ action: 'settings', entityType: 'Data', entityName: name, message: `Added team member "${name}"` });
    UI.toast(`${name} added`, 'success');
    this.route('settings');
  },

  async removeTeamMember(name) {
    const ok = await UI.confirm(`Remove "${name}" from the team? Companies/tasks already assigned to them keep the name, but it won't be selectable anymore.`, {
      title: 'Remove team member', confirmLabel: 'Remove', requirePassword: true
    });
    if (!ok) return;
    const idx = OPTIONS.assignedTo.indexOf(name);
    if (idx >= 0) OPTIONS.assignedTo.splice(idx, 1);
    await DB.setSetting('team', OPTIONS.assignedTo.slice());
    await this.logChange({ action: 'settings', entityType: 'Data', entityName: name, message: `Removed team member "${name}"` });
    UI.toast(`${name} removed`, 'success');
    this.route('settings');
  },

  // ---------- SETTINGS / BACKUP ----------
  renderSettings() {
    const main = document.getElementById('main');
    main.innerHTML = `
      <div class="view-header"><h1>Settings & Backup</h1><p class="sub">Data is shared live via Firebase — every teammate sees the same records in real time.</p></div>
      <div class="settings-grid">
        <div class="panel">
          <h3>Backup</h3>
          <p class="panel-desc">Download a full JSON snapshot of every company, contact, and task. Keep this safe — it's the fastest way to restore everything.</p>
          <button class="btn btn-primary" id="download-backup">Download Backup (JSON)</button>
        </div>
        <div class="panel">
          <h3>Restore</h3>
          <p class="panel-desc">Restoring replaces all current data with the contents of the backup file.</p>
          <button class="btn btn-ghost" id="restore-backup">Restore from JSON</button>
          <input type="file" id="restore-file" accept=".json" hidden>
        </div>
        <div class="panel">
          <h3>Excel Sync</h3>
          <p class="panel-desc">Import merges by ID (existing records update, new ones are added — nothing is deleted). Export writes a workbook with the same sheet names and headers as your original CRM.xlsx.</p>
          <button class="btn btn-primary" id="settings-export">Export to Excel</button>
          <button class="btn btn-ghost" id="settings-csv">Export Companies (CSV)</button>
        </div>
        <div class="panel">
          <h3>Team Members</h3>
          <p class="panel-desc">These names appear in every "Assigned To" dropdown across the CRM. Removing a name is password-protected.</p>
          <div class="team-add-row">
            <input type="text" id="team-new-name" placeholder="e.g. Sara Hassan" maxlength="60">
            <button class="btn btn-primary btn-sm" id="team-add-btn">Add</button>
          </div>
          <ul class="team-list">
            ${OPTIONS.assignedTo.map(name => `
              <li class="team-item">
                <span>${UI.escapeHtml(name)}</span>
                <button class="icon-btn team-remove" data-name="${UI.escapeHtml(name)}" title="Remove">🗑</button>
              </li>`).join('') || '<li class="team-empty">No team members yet.</li>'}
          </ul>
        </div>
        <div class="panel">
          <h3>Danger Zone</h3>
          <p class="panel-desc">Permanently erase all CRM data for everyone — this is the shared team database, not just this browser.</p>
          <button class="btn btn-danger" id="wipe-data">Erase All Data</button>
        </div>
      </div>
    `;
    document.getElementById('download-backup').onclick = async () => {
      const snap = await DB.exportAll();
      const blob = new Blob([JSON.stringify(snap, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const fname = `crm_backup_${new Date().toISOString().slice(0, 10)}.json`;
      const a = document.createElement('a'); a.href = url; a.download = fname; a.click();
      URL.revokeObjectURL(url);
      await this.logChange({ action: 'export', entityType: 'Data', entityName: fname, message: `Downloaded full backup (${fname})` });
      UI.toast('Backup downloaded', 'success');
    };
    document.getElementById('restore-backup').onclick = () => document.getElementById('restore-file').click();
    document.getElementById('restore-file').addEventListener('change', async (e) => {
      const file = e.target.files[0]; if (!file) return;
      const ok = await UI.confirm('Restoring will replace ALL current data for everyone with this backup. Continue?');
      if (!ok) { e.target.value = ''; return; }
      const text = await file.text();
      try {
        const snap = JSON.parse(text);
        if (!snap || typeof snap !== 'object') throw new Error('Invalid backup structure');
        await DB.importAll(snap);
        await this.reloadAll();
        await this.logChange({ action: 'restore', entityType: 'Data', entityName: file.name, message: `Restored full backup from ${file.name}` });
        UI.toast('Backup restored', 'success');
        this.route('dashboard');
      } catch (err) { console.error(err); UI.toast('Invalid backup file — could not parse JSON', 'error'); }
      e.target.value = '';
    });
    const teamAddBtn = document.getElementById('team-add-btn');
    const teamInput = document.getElementById('team-new-name');
    teamAddBtn.onclick = () => this.addTeamMember(teamInput.value);
    teamInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') this.addTeamMember(teamInput.value); });
    main.querySelectorAll('.team-remove').forEach(btn => {
      btn.addEventListener('click', () => this.removeTeamMember(btn.dataset.name));
    });
    document.getElementById('settings-export').onclick = () => this.handleExport();
    document.getElementById('settings-csv').onclick = () => Excel.exportCSV();
    document.getElementById('wipe-data').onclick = async () => {
      const ok = await UI.confirm('This permanently erases every company, contact, and task for everyone on the team. There is no undo unless you have a backup.', { confirmLabel: 'Erase Everything', requirePassword: true });
      if (!ok) return;
      await Promise.all([DB.companies.clear(), DB.contacts.clear(), DB.tasks.clear(), DB.activities.clear(), DB.followups.clear()]);
      await this.reloadAll();
      UI.toast('All data erased', 'success');
      this.route('dashboard');
    };
  },

  // ---------- Import / Export handlers (global toolbar) ----------
  async handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const parsed = await Excel.readFile(file);
      const result = await Excel.mergeImport(parsed);
      await this.reloadAll();
      await this.logChange({
        action: 'import', entityType: 'Data', entityName: file.name,
        message: `Imported ${result.companies.added} new / ${result.companies.updated} updated companies, ${result.contacts.added} new / ${result.contacts.updated} updated contacts from ${file.name}`
      });
      UI.toast(`Imported: ${result.companies.added} new / ${result.companies.updated} updated companies, ${result.contacts.added} new / ${result.contacts.updated} updated contacts`, 'success');
      this.route(this.state.view);
    } catch (err) {
      console.error(err);
      UI.toast('Could not read that file — check it matches the CRM format', 'error');
    }
    e.target.value = '';
  },

  async handleExport() {
    try {
      const fname = await Excel.exportWorkbook();
      await this.logChange({ action: 'export', entityType: 'Data', entityName: fname, message: `Exported data to ${fname}` });
      UI.toast(`Exported ${fname}`, 'success');
    } catch (err) {
      console.error(err);
      UI.toast('Export failed', 'error');
    }
  }
};

if (FIREBASE_CONFIGURED && !firebaseInitError) {
  document.addEventListener('DOMContentLoaded', () => App.init());
}


</script>
</body>
</html>
