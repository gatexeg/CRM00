<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mirapp-eg</title>
<style>
/* ============================================================
   style.css
   Design language: "Harbor" — a control-tower feel for a B2B
   valet/parking/hospitality sales team. Deep slate-navy base
   (not pure black), a teal signal color standing in for radar
   pings / tracked vehicles, amber for attention states. Inter
   for UI text, a slightly condensed display cut for numbers.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;600&display=swap');

:root {
  --bg: #0F131C;
  --bg-elevated: #161C29;
  --panel: #171E2C;
  --panel-2: #1D2536;
  --border: #262f42;
  --text: #E7EAF2;
  --text-muted: #8b93a7;
  --text-dim: #5c6478;
  --accent: #3EB6A0;
  --accent-strong: #35A18E;
  --accent-2: #F2A65A;
  --danger: #E0654F;
  --good: #5FCB93;
  --warn: #F2A65A;
  --radius: 10px;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'Roboto Mono', monospace;
}

html[data-theme="light"] {
  --bg: #F3F5F9;
  --bg-elevated: #FFFFFF;
  --panel: #FFFFFF;
  --panel-2: #F7F8FB;
  --border: #E2E6EF;
  --text: #171B26;
  --text-muted: #626b80;
  --text-dim: #9aa2b5;
  --accent: #17967F;
  --accent-strong: #0F7C69;
  --accent-2: #C97A2E;
  --danger: #C6432E;
  --good: #1E9A5E;
  --warn: #C97A2E;
  --shadow: 0 6px 18px rgba(30,40,60,0.08);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  transition: background .2s ease, color .2s ease;
}

::selection { background: var(--accent); color: #0a0d13; }

/* ---------- App shell ---------- */
.app-shell {
  display: grid;
  grid-template-columns: 236px 1fr;
  min-height: 100vh;
}

.sidebar {
  background: var(--bg-elevated);
  border-right: 1px solid var(--border);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 22px;
}
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; color: #0a0d13; font-size: 14px;
  flex-shrink: 0;
}
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
.brand-sub { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; }

.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px;
  border-radius: 8px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
  user-select: none;
  transition: background .12s ease, color .12s ease;
}
.nav-item:hover { background: var(--panel-2); color: var(--text); }
.nav-item.active { background: var(--accent); color: #0a0d13; font-weight: 600; }
.nav-icon { width: 18px; text-align: center; font-size: 14px; }

.sidebar-footer {
  margin-top: auto;
  padding: 10px;
  font-size: 11px;
  color: var(--text-dim);
  border-top: 1px solid var(--border);
  padding-top: 14px;
}

/* ---------- Topbar ---------- */
.topbar {
  height: 62px;
  display: flex; align-items: center; gap: 14px;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elevated);
  position: sticky; top: 0; z-index: 10;
}
.search-wrap { flex: 1; max-width: 420px; position: relative; }
.search-wrap input {
  width: 100%; padding: 9px 12px 9px 34px;
  border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text); font-size: 13.5px;
}
.search-wrap::before {
  content: '🔍'; position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  font-size: 12px; opacity: .6;
}
.topbar-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }

.btn {
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-ui);
  transition: transform .08s ease, background .12s ease, border-color .12s ease;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #0a0d13; }
.btn-primary:hover { background: var(--accent-strong); }
.btn-ghost { background: transparent; border-color: var(--border); color: var(--text); }
.btn-ghost:hover { background: var(--panel-2); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { filter: brightness(1.08); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.icon-btn-round {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn-round:hover { background: var(--panel); }

/* ---------- Main content ---------- */
main#main { padding: 26px 28px 60px; max-width: 1400px; }
.view-header { margin-bottom: 20px; }
.view-header.row { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px; }
.view-header h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.01em; }
.view-header .sub { color: var(--text-muted); font-size: 13px; margin: 0; }
.header-actions { display: flex; gap: 8px; }

/* ---------- KPI cards ---------- */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 12px;
  margin-bottom: 22px;
}
.kpi-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  animation: rise .35s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.kpi-icon { font-size: 16px; opacity: .8; margin-bottom: 8px; }
.kpi-value { font-family: var(--font-mono); font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.kpi-value.good { color: var(--good); }
.kpi-value.bad { color: var(--danger); }
.kpi-value.warn { color: var(--warn); }
.kpi-label { color: var(--text-muted); font-size: 12px; margin-top: 4px; font-weight: 500; }

/* ---------- Panels / charts ---------- */
.chart-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 14px; }
.bottom-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.followup-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}
.panel h3 { margin: 0 0 14px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.panel-desc { color: var(--text-muted); font-size: 12.5px; line-height: 1.5; margin: 0 0 14px; }
.team-add-row { display: flex; gap: 8px; margin-bottom: 12px; }
.team-add-row input {
  flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text); font-size: 13px; font-family: var(--font-ui);
}
.team-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
.team-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--border);
  font-size: 13px;
}
.team-empty { color: var(--text-dim); font-size: 12.5px; padding: 6px 2px; }
.count-badge { background: var(--panel-2); border-radius: 20px; padding: 1px 8px; font-size: 11px; color: var(--text-muted); font-weight: 600; }

@media (max-width: 1100px) {
  .chart-grid, .bottom-grid, .followup-grid { grid-template-columns: 1fr; }
}

/* ---------- Save status & last updated (top bar) ---------- */
.save-status {
  display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-muted);
  padding: 7px 11px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--border);
  white-space: nowrap;
}
.save-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex-shrink: 0; transition: background .2s ease; }
.save-dot.saving { background: var(--warn); animation: save-pulse 1s ease-in-out infinite; }
.save-dot.saved { background: var(--good); }
.save-dot.error { background: var(--danger); }
@keyframes save-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.last-updated { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; }
.last-updated b { color: var(--text-muted); font-weight: 600; }
.ver-badge { font-size: 11px; color: var(--text-dim); font-weight: 500; margin-left: 6px; vertical-align: middle; }
@media (max-width: 1240px) { .last-updated { display: none; } }
@media (max-width: 980px) { .save-status span:not(.save-dot) { display: none; } }

/* ---------- History / Activity Log ---------- */
.history-list { display: flex; flex-direction: column; gap: 10px; }
.history-card { display: flex; gap: 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.hist-time { width: 82px; flex-shrink: 0; font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }
.hist-time-sub { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
.hist-body { flex: 1; min-width: 0; }
.hist-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }
.hist-entity { font-weight: 600; font-size: 13px; }
.hist-badge.badge-create { background: rgba(95,203,147,.15); color: var(--good); border-color: transparent; }
.hist-badge.badge-update { background: rgba(62,182,160,.12); color: var(--accent); border-color: transparent; }
.hist-badge.badge-delete { background: rgba(224,101,79,.14); color: var(--danger); border-color: transparent; }
.hist-badge.badge-restore, .hist-badge.badge-undo { background: rgba(242,166,90,.14); color: var(--warn); border-color: transparent; }
.hist-badge.badge-import, .hist-badge.badge-export, .hist-badge.badge-settings { background: var(--panel-2); color: var(--text-muted); }
.hist-diffs { display: flex; flex-direction: column; gap: 4px; margin-bottom: 9px; }
.hist-diff { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; flex-wrap: wrap; }
.hist-diff-field { color: var(--text-muted); min-width: 120px; font-weight: 600; }
.hist-diff-old { color: var(--text-dim); text-decoration: line-through; }
.hist-diff-arrow { color: var(--text-dim); }
.hist-diff-new { color: var(--text); font-weight: 600; }
.hist-msg { font-size: 13px; color: var(--text-muted); margin-bottom: 9px; }
.hist-fulldata { margin: 0 0 10px; }
.hist-fulldata summary {
  cursor: pointer; font-size: 12px; font-weight: 600; color: var(--accent);
  user-select: none; list-style: none;
}
.hist-fulldata summary::-webkit-details-marker { display: none; }
.hist-fulldata summary::before { content: '▸ '; }
.hist-fulldata[open] summary::before { content: '▾ '; }
.hist-fulldata-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 6px 16px; margin-top: 10px; padding: 12px; border-radius: 8px;
  background: var(--panel-2); border: 1px solid var(--border);
}
.hist-fulldata-row { display: flex; flex-direction: column; gap: 1px; font-size: 12px; }
.hist-fulldata-label { color: var(--text-dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; }
.hist-fulldata-value { color: var(--text); word-break: break-word; }
.hist-foot { display: flex; align-items: center; gap: 10px; }
.hist-id { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }

/* ---------- Activity feed ---------- */
.activity-list { display: flex; flex-direction: column; gap: 12px; max-height: 340px; overflow-y: auto; }
.activity-row { display: flex; gap: 10px; align-items: flex-start; }
.activity-row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex-shrink: 0; }
.activity-msg { font-size: 13px; }
.activity-time { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
.empty-hint { color: var(--text-dim); font-size: 12.5px; }

.quick-actions { display: flex; flex-direction: column; gap: 8px; }
.quick-actions .btn { width: 100%; text-align: center; }

/* ---------- Filter bar ---------- */
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filter-select {
  padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text); font-size: 12.5px; font-family: var(--font-ui);
}

/* ---------- Data table ---------- */
.table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  text-align: left; padding: 11px 14px; color: var(--text-muted); font-weight: 600;
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
  border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); white-space: nowrap;
}
.data-table th.sortable { cursor: pointer; user-select: none; }
.data-table th.sortable:hover { color: var(--text); }
.data-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--panel-2); }
.cell-main { font-weight: 600; }
.cell-sub { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }
.empty-cell { text-align: center; padding: 44px 20px !important; color: var(--text-muted); }
.empty-cell a { color: var(--accent); cursor: pointer; }
.row-actions { display: flex; gap: 4px; white-space: nowrap; }
.icon-btn {
  border: none; background: transparent; color: var(--text-muted); cursor: pointer;
  padding: 5px 7px; border-radius: 6px; font-size: 13px;
}
.icon-btn:hover { background: var(--panel-2); color: var(--text); }
.text-danger { color: var(--danger); }
.text-warn { color: var(--warn); }

/* ---------- Chips ---------- */
.chip {
  display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px;
  font-weight: 600; background: var(--panel-2); border: 1px solid var(--border); color: var(--text-muted);
}
.chip.stage { background: rgba(62,182,160,.12); color: var(--accent); border-color: transparent; }
.chip.prio-High { background: rgba(224,101,79,.14); color: var(--danger); border-color: transparent; }
.chip.prio-Medium { background: rgba(242,166,90,.14); color: var(--warn); border-color: transparent; }
.chip.prio-Low { background: rgba(139,147,167,.14); color: var(--text-muted); border-color: transparent; }
.chip.status-Client { background: rgba(95,203,147,.15); color: var(--good); border-color: transparent; }
.chip.status-QualifiedLead { background: rgba(62,182,160,.15); color: var(--accent); border-color: transparent; }

/* ---------- Bulk bar ---------- */
.bulk-bar {
  position: sticky; bottom: 14px; margin-top: 14px;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 12.5px;
  box-shadow: var(--shadow);
}

/* ---------- Kanban ---------- */
.kanban-board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; }
.kanban-col { flex: 0 0 250px; display: flex; flex-direction: column; }
.kanban-col-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 4px 10px; font-size: 12.5px; font-weight: 700; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: .03em;
}
.kanban-count { background: var(--panel-2); border-radius: 20px; padding: 1px 8px; font-size: 11px; }
.kanban-drop {
  background: var(--panel-2); border: 1px dashed var(--border); border-radius: var(--radius);
  padding: 8px; min-height: 120px; flex: 1; display: flex; flex-direction: column; gap: 8px;
  transition: background .1s ease, border-color .1s ease;
}
.kanban-drop.drop-hover { background: rgba(62,182,160,.08); border-color: var(--accent); }
.kanban-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; cursor: grab; box-shadow: var(--shadow);
}
.kanban-card.dragging { opacity: .4; }
.kc-title { font-weight: 600; font-size: 13px; margin-bottom: 6px; }
.kc-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.kc-value { font-family: var(--font-mono); font-size: 12px; color: var(--good); font-weight: 600; }
.kc-meta-sub { font-size: 11px; color: var(--text-dim); }

/* ---------- Follow-ups ---------- */
.followup-list { display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow-y: auto; }
.followup-item {
  display: flex; justify-content: space-between; padding: 9px 6px; border-radius: 6px;
  cursor: pointer; font-size: 13px;
}
.followup-item:hover { background: var(--panel-2); }
.followup-date { color: var(--text-dim); font-size: 12px; }
.fu-count {
  display: inline-flex; align-items: center; gap: 3px; margin-left: 6px;
  padding: 1px 7px; border-radius: 999px; background: var(--panel-2);
  border: 1px solid var(--border); font-size: 11px; color: var(--text-muted); white-space: nowrap;
}
.fu-count-hint { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; display: block; }

.task-list { display: flex; flex-direction: column; gap: 4px; }
.task-row { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-radius: 8px; }
.task-row:hover { background: var(--panel-2); }
.task-row.done .task-title { text-decoration: line-through; color: var(--text-dim); }
.task-info { flex: 1; }
.task-title { font-size: 13.5px; font-weight: 600; }
.task-sub { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }

/* ---------- Modals ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(6,8,13,.6); backdrop-filter: blur(2px);
  display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.overlay.open { display: flex; }
.modal {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 14px;
  padding: 24px; width: 100%; max-width: 620px; max-height: 88vh; overflow-y: auto;
  box-shadow: var(--shadow); animation: pop .16s ease both;
}
.modal-sm { max-width: 400px; }
@keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
.modal h3 { margin: 0 0 16px; font-size: 17px; font-weight: 700; }
.modal-msg { color: var(--text-muted); font-size: 13.5px; line-height: 1.5; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.confirm-pw-label { display: block; margin-top: 14px; font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
.confirm-pw-input {
  display: block; width: 100%; margin-top: 6px; padding: 9px 12px;
  border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2);
  color: var(--text); font-size: 13.5px; font-family: var(--font-ui);
}
.confirm-pw-input:focus { outline: none; border-color: var(--accent); }
.confirm-pw-error { display: none; color: var(--danger); font-size: 12px; margin: 6px 0 0; }
.confirm-pw-error.show { display: block; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.form-grid .span-2 { grid-column: span 2; }
.form-grid label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
.form-grid input, .form-grid select, .form-grid textarea {
  padding: 8px 10px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text); font-size: 13.5px; font-family: var(--font-ui); font-weight: 400;
}
.form-grid textarea { resize: vertical; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .form-grid .span-2 { grid-column: span 1; } }

.fu-form-label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
.fu-form-label textarea {
  padding: 9px 11px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text); font-size: 13.5px; font-family: var(--font-ui);
  font-weight: 400; resize: vertical;
}
.fu-history { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.fu-history h4 { margin: 0 0 8px; font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
.fu-history-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; }

// ============================================================

// Get it from: Firebase Console → Project settings → General →

//     }

// (That allows anyone with the URL to read/write — fine for an
// internal team tool, but add Firebase Auth + tighter rules before
// exposing this outside your team.)
// ============================================================
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

// True only once someone has actually pasted their real project config in.
const FIREBASE_CONFIGURED = firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY' && firebaseConfig.projectId !== 'YOUR_PROJECT_ID';

let fsdb = null;
let firebaseInitError = null;
if (FIREBASE_CONFIGURED) {
  try {
    firebase.initializeApp(firebaseConfig);
    fsdb = firebase.firestore();
  } catch (err) {
    firebaseInitError = err;
    console.error('Firebase failed to initialize:', err);
  }
}

/** Shows a full-page setup/error screen instead of silently rendering an empty, broken app. */
function showFirebaseBlockingScreen(title, lines) {
  const render = () => {
    document.body.innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0F131C;color:#E7EAF2;font-family:Inter,-apple-system,sans-serif;">

        </div>
      </div>`;
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
  else render();
}

if (!FIREBASE_CONFIGURED) {
  showFirebaseBlockingScreen('⚠️ Firebase not configured yet / لسه متوصلش بـ Firebase', [
    'This file still has the placeholder <code>firebaseConfig</code> values (<code>YOUR_API_KEY</code>, etc.) — the app can\'t connect to any database until you paste your real project\'s config.',
    'لسه القيم في <code>firebaseConfig</code> أول الملف زي ما هي (<code>YOUR_API_KEY</code>...). لازم تستبدلها ببيانات مشروعك من Firebase Console → Project settings → Your apps، وتتأكد إن Firestore Database متفعّل.',

} else if (firebaseInitError) {

/* ===== storage.js ===== */
/* ============================================================
   storage.js — Persistence layer, now backed by Firebase Firestore
   instead of IndexedDB. Firestore is the single shared database:
   every browser that opens this file reads and writes the same
   collections, and onSnapshot() pushes any change (from anyone)
   to everyone else live, with no refresh needed. The public shape
   (DB.companies.all(), DB.companies.put(), DB.companies.onChange(),
   etc.) is unchanged, so nothing else in app.js had to be touched.
   ============================================================ */

// Password required to confirm any permanent-delete action (companies, contacts,
// tasks, team members, full data wipe). Change this string to change the password.
const DELETE_PASSWORD = '2026';

function makeRepo(storeName, idField = 'id') {
  const col = () => fsdb.collection(storeName);
  return {
    async all() {
      const snap = await col().get();
      return snap.docs.map(d => d.data());
    },
    async get(id) {
      const doc = await col().doc(String(id)).get();
      return doc.exists ? doc.data() : undefined;
    },
    async put(record) {
      SaveStatus.saving();
      try {
        await col().doc(String(record[idField])).set(record);
        SaveStatus.saved();
        return record;
      } catch (err) { SaveStatus.error(); throw err; }
    },
    async bulkPut(records) {
      SaveStatus.saving();
      try {
        const batch = fsdb.batch();
        records.forEach(r => batch.set(col().doc(String(r[idField])), r));
        await batch.commit();
        SaveStatus.saved();
        return records;
      } catch (err) { SaveStatus.error(); throw err; }
    },
    async delete(id) {
      SaveStatus.saving();
      try {
        await col().doc(String(id)).delete();
        SaveStatus.saved();
        return id;
      } catch (err) { SaveStatus.error(); throw err; }
    },
    async clear() {
      SaveStatus.saving();
      try {
        const snap = await col().get();
        const batch = fsdb.batch();
        snap.docs.forEach(d => batch.delete(d.ref));
        await batch.commit();
        SaveStatus.saved();
      } catch (err) { SaveStatus.error(); throw err; }
    },
    // Live subscription — fires immediately with current data, then again
    // every time ANY user adds/edits/deletes a record in this collection.
    onChange(cb) {
      return col().onSnapshot(
        snap => cb(snap.docs.map(d => d.data())),
        err => console.error(`Realtime sync error on "${storeName}":`, err)
      );
    }
  };
}

const DB = {
  companies: makeRepo('companies'),
  contacts: makeRepo('contacts'),
  tasks: makeRepo('tasks'),
  activities: makeRepo('activities'),
  meta: makeRepo('meta', 'key'),
  followups: makeRepo('followups'),

  async getSetting(key, fallback = null) {
    const rec = await this.meta.get(key);
    return rec ? rec.value : fallback;
  },
  async setSetting(key, value) {
    return this.meta.put({ key, value });
  },

  /** Full JSON snapshot of every store — used for backup/restore. */
  async exportAll() {
    const [companies, contacts, tasks, activities, followups] = await Promise.all([
      this.companies.all(), this.contacts.all(), this.tasks.all(), this.activities.all(), this.followups.all()
    ]);
    return { version: 3, exportedAt: new Date().toISOString(), companies, contacts, tasks, activities, followups };
  },

  /** Restores a JSON snapshot produced by exportAll(). Replaces existing data for everyone. */
  async importAll(snapshot) {
    await Promise.all([
      this.companies.clear(), this.contacts.clear(), this.tasks.clear(), this.activities.clear(), this.followups.clear()
    ]);
    await Promise.all([
      snapshot.companies?.length ? this.companies.bulkPut(snapshot.companies) : null,
      snapshot.contacts?.length ? this.contacts.bulkPut(snapshot.contacts) : null,
      snapshot.tasks?.length ? this.tasks.bulkPut(snapshot.tasks) : null,
      snapshot.activities?.length ? this.activities.bulkPut(snapshot.activities) : null,
      snapshot.followups?.length ? this.followups.bulkPut(snapshot.followups) : null,
    ]);
  }
};

/* ===== excel.js ===== */
/* ============================================================
   excel.js — Excel <-> CRM sync
   Uses SheetJS (loaded via CDN in index.html) to read/write
   .xlsx files with the exact same headers as the original
   CRM.xlsx, so round-tripping through Excel preserves meaning.
   ============================================================ */

const Excel = {
  /**
   * Reads a File (.xlsx/.csv), returns { companies, contacts, stats }.
   * Rows that are entirely empty (aside from an auto-numbered ID) are skipped.
   */
  async readFile(file) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });

    const companySheetName = wb.SheetNames.find(n => /compan(y|ies)/i.test(n) && !/contact|decision/i.test(n)) || wb.SheetNames[0];
    const contactSheetName = wb.SheetNames.find(n => /contact|decision/i.test(n));

    const companies = companySheetName ? this._sheetToRecords(wb.Sheets[companySheetName], COMPANY_FIELD_MAP, blankCompany) : [];
    const contacts = contactSheetName ? this._sheetToRecords(wb.Sheets[contactSheetName], CONTACT_FIELD_MAP, () => blankContact()) : [];

    return { companies, contacts, stats: { companies: companies.length, contacts: contacts.length } };
  },

  _sheetToRecords(sheet, fieldMap, blankFactory) {
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
    const norm = (s) => String(s).trim().toLowerCase();
    // Build a lookup from normalized header -> field, so trailing spaces or
    // case differences in the source workbook (like "Contact name ") still match.
    const normFieldMap = {};
    for (const [header, field] of Object.entries(fieldMap)) normFieldMap[norm(header)] = field;

    const out = [];
    for (const row of rows) {
      const rec = blankFactory();
      let hasData = false;
      const normRow = {};
      for (const key of Object.keys(row)) normRow[norm(key)] = row[key];

      for (const [normHeader, field] of Object.entries(normFieldMap)) {
        if (!(normHeader in normRow)) continue;
        let val = normRow[normHeader];
        if (field === 'id') {
          if (val !== '' && val != null) rec.id = String(val).trim();
          continue;
        }
        if (val === '' || val == null) continue;
        if (field === 'followUpCount' || field === 'dealValue') val = Number(val) || 0;
        if (field === 'archived') val = /^(true|1|yes)$/i.test(String(val));
        if ((field === 'lastContactDate' || field === 'nextFollowUp') && val instanceof Date) {
          val = val.toISOString().slice(0, 10);
        }
        rec[field] = val;
        hasData = true;
      }
      if (hasData) {
        rec.updatedAt = nowISO();
        if (!rec.createdAt) rec.createdAt = nowISO();
        out.push(rec);
      }
    }
    return out;
  },

  /** Merges imported records into the DB: updates existing IDs, inserts new ones. Never deletes. */
  async mergeImport(imported) {
    let added = 0, updated = 0;
    for (const c of imported.companies) {
      const existing = await DB.companies.get(c.id);
      await DB.companies.put({ ...(existing || {}), ...c, id: c.id });
      existing ? updated++ : added++;
    }
    let cAdded = 0, cUpdated = 0;
    for (const c of imported.contacts) {
      const existing = await DB.contacts.get(c.id);
      await DB.contacts.put({ ...(existing || {}), ...c, id: c.id });
      existing ? cUpdated++ : cAdded++;
    }
    return { companies: { added, updated }, contacts: { added: cAdded, updated: cUpdated } };
  },

  /** Exports current DB state to a downloadable .xlsx matching the original headers. */
  async exportWorkbook() {
    const [companies, contacts] = await Promise.all([DB.companies.all(), DB.contacts.all()]);
    const wb = XLSX.utils.book_new();

    const companyRows = companies.map(c => {
      const row = {};
      for (const h of COMPANY_XLSX_HEADERS) row[h] = c[COMPANY_FIELD_MAP[h]] ?? '';
      return row;
    });
    const contactRows = contacts.map(c => {
      const row = {};
      for (const h of CONTACT_XLSX_HEADERS) row[h] = c[CONTACT_FIELD_MAP[h]] ?? '';
      return row;
    });

    const wsCompanies = XLSX.utils.json_to_sheet(companyRows, { header: COMPANY_XLSX_HEADERS });
    const wsContacts = XLSX.utils.json_to_sheet(contactRows, { header: CONTACT_XLSX_HEADERS });
    XLSX.utils.book_append_sheet(wb, wsCompanies, 'Companies (master sheet)');
    XLSX.utils.book_append_sheet(wb, wsContacts, 'Companies decision makers conta');

    const fname = `CRM_export_${new Date().toISOString().slice(0, 10)}.xlsx`;
    XLSX.writeFile(wb, fname);
    return fname;
  },

  /** Exports companies as CSV. */
  async exportCSV() {
    const companies = await DB.companies.all();
    const rows = companies.map(c => {
      const row = {};
      for (const h of COMPANY_XLSX_HEADERS) row[h] = c[COMPANY_FIELD_MAP[h]] ?? '';
      return row;
    });
    const ws = XLSX.utils.json_to_sheet(rows, { header: COMPANY_XLSX_HEADERS });
    const csv = XLSX.utils.sheet_to_csv(ws);
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `CRM_companies_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }
};

/* ============================================================
   ui.js — Small reusable UI helpers (toasts, modal, confirm)
   ============================================================ */

const UI = {
  toast(message, type = 'info') {
    const host = document.getElementById('toast-host');
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    const icons = { success: '✓', error: '✕', info: 'ℹ', warn: '!' };
    el.innerHTML = `<span class="toast-icon">${icons[type] || icons.info}</span><span>${message}</span>`;
    host.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 3200);
  },

  confirm(message, { title = 'Are you sure?', danger = true, confirmLabel = 'Delete', requirePassword = false } = {}) {
    return new Promise((resolve) => {
      const overlay = document.getElementById('confirm-overlay');
      overlay.innerHTML = `
        <div class="modal modal-sm">
          <h3>${title}</h3>
          <p class="modal-msg">${message}</p>
          ${requirePassword ? `
          <label class="confirm-pw-label">Password required to delete
            <input type="password" id="confirm-password" class="confirm-pw-input" placeholder="Enter password" autocomplete="off">
          </label>
          <p class="confirm-pw-error" id="confirm-pw-error">Incorrect password</p>` : ''}
          <div class="modal-actions">
            <button class="btn btn-ghost" id="confirm-cancel">Cancel</button>
            <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="confirm-ok">${confirmLabel}</button>
          </div>
        </div>`;
      overlay.classList.add('open');
      const close = (val) => { overlay.classList.remove('open'); overlay.innerHTML = ''; resolve(val); };
      const pwInput = requirePassword ? overlay.querySelector('#confirm-password') : null;
      const pwError = requirePassword ? overlay.querySelector('#confirm-pw-error') : null;
      const attemptConfirm = () => {
        if (requirePassword && (pwInput.value || '') !== DELETE_PASSWORD) {
          pwError.classList.add('show');
          pwInput.value = '';
          pwInput.focus();
          return;
        }
        close(true);
      };
      overlay.querySelector('#confirm-cancel').onclick = () => close(false);
      overlay.querySelector('#confirm-ok').onclick = attemptConfirm;
      if (pwInput) {
        pwInput.focus();
        pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptConfirm(); });
      }
      overlay.onclick = (e) => { if (e.target === overlay) close(false); };
    });
  },

  openModal(html) {
    const overlay = document.getElementById('modal-overlay');
    overlay.innerHTML = html;
    overlay.classList.add('open');
    overlay.onclick = (e) => { if (e.target === overlay) UI.closeModal(); };
    document.addEventListener('keydown', UI._escHandler);
  },
  closeModal() {
    const overlay = document.getElementById('modal-overlay');
    overlay.classList.remove('open');
    overlay.innerHTML = '';
    document.removeEventListener('keydown', UI._escHandler);
  },
  _escHandler(e) { if (e.key === 'Escape') UI.closeModal(); },

  escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  },

  optionsHtml(list, selected) {
    return `<option value="">—</option>` + list.map(o => `<option value="${o}" ${o === selected ? 'selected' : ''}>${o}</option>`).join('');
  },

  fmtDate(d) {
    if (!d) return '—';
    const date = new Date(d);
    if (isNaN(date)) return d;
    return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  },

  fmtMoney(n) {
    n = Number(n) || 0;
    return '$' + n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  },

  todayISO() { return new Date().toISOString().slice(0, 10); },

  daysFromNow(n) {
    const d = new Date(); d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }
};


/* ===== history.js ===== */
/* ============================================================
   history.js — Save-status indicator + change-tracking helpers.
   SaveStatus reflects the real state of the last DB write (every
   DB.*.put / delete / bulkPut / clear call in storage.js reports
   into it), so the top-bar dot is never just decorative.
   diffRecords() produces the old/new field pairs that power the
   Activity Log and Undo/Restore.
   ============================================================ */

const SaveStatus = {
  _errorTimer: null,
  saving() {
    const dot = document.getElementById('save-dot');
    const text = document.getElementById('save-text');
    if (!dot || !text) return;
    clearTimeout(this._errorTimer);
    dot.className = 'save-dot saving';
    text.textContent = 'Saving...';
  },
  saved() {
    const dot = document.getElementById('save-dot');
    const text = document.getElementById('save-text');
    if (!dot || !text) return;
    dot.className = 'save-dot saved';
    text.textContent = 'All Changes Saved';
  },
  error() {
    const dot = document.getElementById('save-dot');
    const text = document.getElementById('save-text');
    if (!dot || !text) return;
    dot.className = 'save-dot error';
    text.textContent = 'Error Saving Data';
    // Auto-recover the indicator after a bit so a transient error
    // doesn't permanently stick the top bar in a red state.
    clearTimeout(this._errorTimer);
    this._errorTimer = setTimeout(() => this.saved(), 5000);
  }
};

/** Compares two plain objects field-by-field and returns [{field,label,old,new}] for anything that changed. */
function diffRecords(oldObj, newObj, labels = {}, skip = ['id', 'createdAt', 'updatedAt', 'version', 'companyName']) {
  const changes = [];
  const keys = new Set([...Object.keys(oldObj || {}), ...Object.keys(newObj || {})]);
  keys.forEach((k) => {
    if (skip.includes(k)) return;
    const ov = oldObj ? oldObj[k] : undefined;
    const nv = newObj ? newObj[k] : undefined;
    const os = ov == null ? '' : String(ov);
    const ns = nv == null ? '' : String(nv);
    if (os !== ns) changes.push({ field: k, label: labels[k] || k, old: os, new: ns });
  });
  return changes;
}

/* ============================================================
   app.js — Application state, routing, and view rendering
   ============================================================ */

const App = {
  state: {
    view: 'dashboard',
    companies: [],
    contacts: [],
    tasks: [],
    activities: [],
    search: '',
    filters: { segment: '', leadStatus: '', pipeline: '', assignedTo: '', priority: '' },
    sort: { field: 'updatedAt', dir: 'desc' },
    showArchived: false,
    selectedIds: new Set(),
    historyFilter: { range: 'all', entityType: '', action: '', search: '' },

    // ----- Follow-up Management module -----
    followups: [],
    fuView: 'table', // table | calendar | analytics
    fuSearch: '',
    fuQuickFilter: '', // dueToday | overdue | upcoming | completedToday | highPriority | meetings | won | lost | ''
    fuFilters: { companyId: '', assignedTo: '', stage: '', status: '', priority: '', method: '', outcome: '', from: '', to: '' },
    fuSort: { field: 'nextFollowUpDate', dir: 'asc' },
    fuPage: 1,
    fuPageSize: 10,
    fuCalendarDate: new Date(),
  },

  async init() {
    try {
      await this.reloadAll();
    } catch (err) {
      console.error('Storage init failed', err);
      UI.toast('Could not reach Firebase — check your firebaseConfig and internet connection', 'error');
    }
    if (this.state.activities[0]) this.touchLastUpdated(this.state.activities[0].timestamp);
    const savedTeam = await DB.getSetting('team', null);
    if (savedTeam && Array.isArray(savedTeam) && savedTeam.length) {
      OPTIONS.assignedTo.length = 0;
      OPTIONS.assignedTo.push(...savedTeam);
    } else {
      await DB.setSetting('team', OPTIONS.assignedTo.slice());
    }
    this.applyTheme(await DB.getSetting('theme', 'dark'));
    this.wireGlobalEvents();
    this.route('dashboard');
    this.wireRealtimeSync();
  },

  // Live sync: each collection pushes updates to every open browser the
  // instant anyone adds, edits, or deletes a record — no refresh needed.
  wireRealtimeSync() {
    const refresh = (view) => { if (this.state.view === view) this.route(view); };
    DB.companies.onChange(list => { this.state.companies = list; refresh('dashboard'); refresh('companies'); refresh('kanban'); });
    DB.contacts.onChange(list => { this.state.contacts = list; refresh('contacts'); });
    DB.tasks.onChange(list => { this.state.tasks = list; refresh('tasks'); });
    DB.followups.onChange(list => { this.state.followups = list; refresh('followupmgmt'); });
    DB.activities.onChange(list => {
      this.state.activities = list.slice().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      if (this.state.activities[0]) this.touchLastUpdated(this.state.activities[0].timestamp);
      refresh('history'); refresh('dashboard');
    });
  },

  async reloadAll() {
    // Promise.allSettled so a corrupted/missing store doesn't take the
    // whole app down — it just loads empty for that one store.
    const results = await Promise.allSettled([
      DB.companies.all(), DB.contacts.all(), DB.tasks.all(), DB.activities.all(), DB.followups.all()
    ]);
    const [companies, contacts, tasks, activities, followups] = results.map(r => r.status === 'fulfilled' ? (r.value || []) : []);
    this.state.companies = companies;
    this.state.contacts = contacts;
    this.state.tasks = tasks;
    this.state.followups = followups;
    this.state.activities = activities.slice().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    const rejected = results.filter(r => r.status === 'rejected');
    if (rejected.length) {
      console.error('Some stores failed to load', rejected);
      if (rejected.length === results.length) {
        // Every single read failed — this is almost always a Firestore setup
        // problem (wrong project, Firestore not created, or locked-down
        // security rules), not a data problem. Show it plainly on screen
        // instead of a toast that disappears in 3 seconds.
        const msg = rejected[0].reason?.message || String(rejected[0].reason);
        showFirebaseBlockingScreen('⚠️ Could not read from Firestore / تعذّر القراءة من Firestore', [
          `Error: ${UI.escapeHtml(msg)}`,
          'This usually means: the Firestore database was never created for this project, the project ID in firebaseConfig is wrong, or the security rules are blocking reads.',
          'المشكلة غالبًا: Firestore Database لسه متعملش Create للمشروع، أو الـ projectId في firebaseConfig غلط، أو الـ Security Rules واقفة قدام القراءة/الكتابة.',
          'Check Firebase Console → Firestore Database (make sure it exists) and → Rules (make sure they allow read/write).'
        ]);
      } else {
        UI.toast('Some data could not be loaded — check your connection', 'error');
      }
    }
  },

  /** Records a structured entry in the Activity Log (History page) and updates the top-bar Last Updated time. */
  async logChange({ action, entityType, entityId = '', entityName = '', changes = [], snapshot = null, fullData = null, message = '' } = {}) {
    const rec = {
      id: uid('A'),
      timestamp: nowISO(),
      action,          // create | update | delete | restore | undo | import | export | settings
      entityType,      // Company | Contact | Task | Data | Settings
      entityId,
      entityName,
      changes,         // [{ field, label, old, new }]
      snapshot,         // full record snapshot, used to Undo an update/create or Restore a delete
      fullData,         // complete record data at the moment of this action, kept permanently for reference
      message: message || this.describeChange(action, entityType, entityName, changes),
      undone: false
    };
    await DB.activities.put(rec);
    this.state.activities.unshift(rec);
    this.touchLastUpdated(rec.timestamp);
    if (this.state.view === 'history') this.renderHistory();
    return rec;
  },

  // Kept for readability at call sites — legacy alias.
  async logActivity(message, companyId = '') {
    return this.logChange({ action: 'update', entityType: 'Company', entityId: companyId, message });
  },

  describeChange(action, entityType, entityName, changes) {
    const name = entityName || 'record';
    const verb = { create: 'Added', update: 'Updated', delete: 'Deleted', restore: 'Restored',
      undo: 'Reverted', import: 'Imported', export: 'Exported', settings: 'Changed' }[action] || action;
    if (changes && changes.length === 1) return `${verb} ${entityType} "${name}" — ${changes[0].label} changed`;
    if (changes && changes.length > 1) return `${verb} ${entityType} "${name}" — ${changes.length} fields changed`;
    return `${verb} ${entityType} "${name}"`;
  },

  touchLastUpdated(ts) {
    const el = document.getElementById('last-updated-value');
    if (!el) return;
    const d = new Date(ts);
    el.textContent = `${d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' })} · ${d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`;
  },

  // ---------- Routing ----------
  route(view) {
    this.state.view = view;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    const map = {
      dashboard: this.renderDashboard, companies: this.renderCompanies, kanban: this.renderKanban,
      contacts: this.renderContacts, tasks: this.renderTasks, followupmgmt: this.renderFollowupMgmt,
      history: this.renderHistory, settings: this.renderSettings
    };
    (map[view] || this.renderDashboard).call(this);
  },

  wireGlobalEvents() {
    document.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => this.route(el.dataset.view));
    });
    document.getElementById('theme-toggle').addEventListener('click', () => this.toggleTheme());
    document.getElementById('global-search').addEventListener('input', (e) => {
      this.state.search = e.target.value.toLowerCase();
      if (this.state.view === 'companies') this.renderCompanies();
    });
    document.getElementById('btn-import').addEventListener('click', () => document.getElementById('file-import').click());
    document.getElementById('file-import').addEventListener('change', (e) => this.handleImport(e));
    document.getElementById('btn-export').addEventListener('click', () => this.handleExport());
    document.getElementById('btn-add-company').addEventListener('click', () => this.openCompanyForm());
  },

  toggleTheme() {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    this.applyTheme(next);
    DB.setSetting('theme', next);
    this.logChange({ action: 'settings', entityType: 'Settings', entityName: 'Theme', message: `Theme changed to ${next} mode` });
  },
  applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    document.getElementById('theme-toggle').textContent = theme === 'light' ? '🌙' : '☀️';
    if (this.state.view) setTimeout(() => this.route(this.state.view), 30);
  },

  // ---------- Derived data helpers ----------
  visibleCompanies() {
    const { search, filters, showArchived } = this.state;
    return this.state.companies.filter(c => {
      if (!showArchived && c.archived) return false;
      if (showArchived && !c.archived) return false;
      if (filters.segment && c.segment !== filters.segment) return false;
      if (filters.leadStatus && c.leadStatus !== filters.leadStatus) return false;
      if (filters.pipeline && c.pipeline !== filters.pipeline) return false;
      if (filters.assignedTo && c.assignedTo !== filters.assignedTo) return false;
      if (filters.priority && c.priority !== filters.priority) return false;
      if (search) {
        const hay = `${c.name} ${c.email} ${c.phone} ${c.website} ${c.notes} ${c.segment}`.toLowerCase();
        if (!hay.includes(search)) return false;
      }
      return true;
    }).sort((a, b) => {
      const { field, dir } = this.state.sort;
      let va = a[field] ?? '', vb = b[field] ?? '';
      if (field === 'dealValue' || field === 'followUpCount') { va = Number(va) || 0; vb = Number(vb) || 0; }
      const cmp = va > vb ? 1 : va < vb ? -1 : 0;
      return dir === 'asc' ? cmp : -cmp;
    });
  },

  kpis() {
    const cs = this.state.companies.filter(c => !c.archived);
    const today = UI.todayISO();
    const in7 = UI.daysFromNow(7);
    const total = cs.length;
    const active = cs.filter(c => !['Deal closed', 'Lost'].includes(c.pipeline)).length;
    const leads = cs.filter(c => ['Lead', 'Qualified Lead'].includes(c.leadStatus)).length;
    const opportunities = cs.filter(c => ['Proposal sent', 'Negotiation', 'Contract sent'].includes(c.pipeline)).length;
    const closed = cs.filter(c => c.pipeline === 'Deal closed').length;
    const lost = cs.filter(c => c.pipeline === 'Lost').length;
    const followUpsToday = cs.filter(c => c.nextFollowUp === today).length;
    const followUpsTotal = cs.reduce((s, c) => s + (Number(c.followUpCount) || 0), 0);
    const upcoming = cs.filter(c => c.nextFollowUp && c.nextFollowUp > today && c.nextFollowUp <= in7).length;
    const overdue = cs.filter(c => c.nextFollowUp && c.nextFollowUp < today && !['Deal closed', 'Lost'].includes(c.pipeline)).length;
    const revenue = cs.filter(c => c.pipeline === 'Deal closed').reduce((s, c) => s + (Number(c.dealValue) || 0), 0);
    const now = new Date();
    const monthRevenue = cs.filter(c => c.pipeline === 'Deal closed' && c.updatedAt && new Date(c.updatedAt).getMonth() === now.getMonth() && new Date(c.updatedAt).getFullYear() === now.getFullYear())
      .reduce((s, c) => s + (Number(c.dealValue) || 0), 0);
    const conversion = total ? Math.round((closed / total) * 1000) / 10 : 0;
    return { total, active, leads, opportunities, closed, lost, followUpsToday, followUpsTotal, upcoming, overdue, revenue, monthRevenue, conversion };
  },

  countBy(arr, field, options) {
    const out = {};
    (options || [...new Set(arr.map(a => a[field]).filter(Boolean))]).forEach(k => out[k] = 0);
    arr.forEach(a => { const v = a[field] || 'Unspecified'; out[v] = (out[v] || 0) + 1; });
    return out;
  },

      th.addEventListener('click', () => {

        else this.state.sort = { field: f, dir: 'asc' };
        this.renderCompanies();
      });
    });
    main.querySelectorAll('.row-edit').forEach(btn => btn.addEventListener('click', () => this.openCompanyForm(btn.dataset.id)));
    main.querySelectorAll('.row-followup').forEach(btn => btn.addEventListener('click', () => this.openFollowUpForm('Company', btn.dataset.id)));
    main.querySelectorAll('.row-delete').forEach(btn => btn.addEventListener('click', () => this.deleteCompany(btn.dataset.id)));
    main.querySelectorAll('.row-select').forEach(cb => cb.addEventListener('change', () => this.updateBulkBar()));
    const selectAll = document.getElementById('select-all');
    if (selectAll) selectAll.addEventListener('change', (e) => {
      main.querySelectorAll('.row-select').forEach(cb => cb.checked = e.target.checked);
      this.updateBulkBar();
    });

    const bulkArchive = document.getElementById('bulk-archive');
    if (bulkArchive) bulkArchive.onclick = () => this.bulkArchive();

  filterSelect(field, label, options) {
    const val = this.state.filters[field];
    return `<select class="filter-select" data-field="${field}">
      <option value="">${label}: All</option>
      ${options.map(o => `<option value="${o}" ${o === val ? 'selected' : ''}>${o}</option>`).join('')}
    </select>`;
  },

  sortableTh(field, label) {
    const { field: sf, dir } = this.state.sort;
    const arrow = sf === field ? (dir === 'asc' ? ' ↑' : ' ↓') : '';
    return `<th class="sortable" data-field="${field}">${label}${arrow}</th>`;
  },

  companyRow(c) {
    const overdue = c.nextFollowUp && c.nextFollowUp < UI.todayISO() && !['Deal closed', 'Lost'].includes(c.pipeline);
    return `<tr>
      <td><input type="checkbox" class="row-select" data-id="${c.id}"></td>
      <td><div class="cell-main">${UI.escapeHtml(c.name) || '<em>Unnamed</em>'}</div><div class="cell-sub">${UI.escapeHtml(c.email) || UI.escapeHtml(c.website) || ''}</div></td>
      <td>${c.segment ? `<span class="chip">${c.segment}</span>` : '—'}</td>
      <td>${c.priority ? `<span class="chip prio-${c.priority}">${c.priority}</span>` : '—'}</td>
      <td><span class="chip status-${(c.leadStatus || '').replace(/\s/g, '')}">${c.leadStatus || '—'}</span></td>
      <td><span class="chip stage">${c.pipeline || '—'}</span></td>
      <td class="${overdue ? 'text-danger' : ''}">${UI.fmtDate(c.nextFollowUp)}${overdue ? ' ⚠️' : ''}<span class="fu-count" title="Follow-ups done so far">🔁 ${Number(c.followUpCount) || 0}</span></td>
      <td>${UI.escapeHtml(c.assignedTo) || '—'}</td>
      <td>${UI.fmtMoney(c.dealValue)}</td>
      <td class="row-actions">
        <button class="icon-btn row-followup" data-id="${c.id}" title="Log Follow-up">🔁</button>
        <button class="icon-btn row-edit" data-id="${c.id}" title="Edit">✎</button>
        <button class="icon-btn row-delete" data-id="${c.id}" title="Delete">🗑</button>
      </td>
    </tr>`;
  },

  updateBulkBar() {
    const ids = [...document.querySelectorAll('.row-select:checked')].map(cb => cb.dataset.id);
    const bar = document.getElementById('bulk-bar');
    bar.hidden = ids.length === 0;
    document.getElementById('bulk-count').textContent = `${ids.length} selected`;
    this._selectedIds = ids;
  },

  async bulkDelete() {
    const ids = this._selectedIds || [];
    if (!ids.length) return;
    const ok = await UI.confirm(`Permanently delete ${ids.length} companies? This cannot be undone.`, { requirePassword: true });
    if (!ok) return;
    const toDelete = this.state.companies.filter(c => ids.includes(c.id));
    for (const c of toDelete) {
      const relatedContacts = this.state.contacts.filter(x => x.companyId === c.id);
      await DB.companies.delete(c.id);
      for (const rc of relatedContacts) await DB.contacts.delete(rc.id);
      await this.logChange({
        action: 'delete', entityType: 'Company', entityId: c.id, entityName: c.name,
        snapshot: { ...c, _relatedContacts: relatedContacts }, fullData: { ...c }
      });
    }
    this.state.companies = this.state.companies.filter(c => !ids.includes(c.id));
    this.state.contacts = this.state.contacts.filter(c => !ids.includes(c.companyId));
    UI.toast(`${ids.length} companies deleted`, 'success');
    this.renderCompanies();
  },

  async bulkArchive() {
    const ids = this._selectedIds || [];
    if (!ids.length) return;
    for (const id of ids) {
      const c = this.state.companies.find(x => x.id === id);
      if (c) {
        const before = { ...c };
        c.archived = true;
        c.updatedAt = nowISO();
        c.version = (Number(c.version) || 1) + 1;
        await DB.companies.put(c);
        await this.logChange({
          action: 'update', entityType: 'Company', entityId: c.id, entityName: c.name,
          changes: diffRecords(before, c, COMPANY_FIELD_LABELS), snapshot: before, fullData: { ...c }
        });
      }
    }
    UI.toast(`${ids.length} companies archived`, 'success');
    this.renderCompanies();
  },

          <label>Segment<select name="segment">${UI.optionsHtml(OPTIONS.segment, c.segment)}</select></label>

          <label>Lead Source<select name="leadSource">${UI.optionsHtml(OPTIONS.leadSource, c.leadSource)}</select></label>

          <label>Assigned To<select name="assignedTo">${UI.optionsHtml(OPTIONS.assignedTo, c.assignedTo)}</select></label>
          <label>Deal Value ($)<input type="number" name="dealValue" value="${c.dealValue || 0}"></label>
          <label>Last Contact Date<input type="date" name="lastContactDate" value="${c.lastContactDate || ''}"></label>
          <label>Next Follow-up<input type="date" name="nextFollowUp" value="${c.nextFollowUp || ''}">${editing ? `<span class="fu-count-hint">🔁 Follow-ups done so far: ${Number(c.followUpCount) || 0}</span>` : ''}</label>
          <label class="span-2">Notes<textarea name="notes" rows="3" placeholder="Context, history, anything useful next time...">${UI.escapeHtml(c.notes)}</textarea></label>
          <div class="modal-actions span-2">
            <button type="button" class="btn btn-ghost" id="cancel-form">Cancel</button>

          </div>
        </form>
      </div>

      e.preventDefault();
      const fd = new FormData(e.target);
      const before = editing ? { ...c } : null;
      const updated = { ...c };
      for (const [k, v] of fd.entries()) updated[k] = v;
      updated.dealValue = Number(updated.dealValue) || 0;
      updated.followUpCount = editing ? (Number(c.followUpCount) || 0) : 0;
      updated.updatedAt = nowISO();
      updated.version = editing ? (Number(c.version) || 1) + 1 : 1;
      if (!editing) updated.createdAt = nowISO();
      await DB.companies.put(updated);
      const idx = this.state.companies.findIndex(x => x.id === updated.id);
      if (idx >= 0) this.state.companies[idx] = updated; else this.state.companies.unshift(updated);
      const changes = editing ? diffRecords(before, updated, COMPANY_FIELD_LABELS) : [];
      await this.logChange({
        action: editing ? 'update' : 'create', entityType: 'Company',
        entityId: updated.id, entityName: updated.name, changes, snapshot: before, fullData: { ...updated }
      });
      UI.toast(`${updated.name || 'Company'} saved`, 'success');
      UI.closeModal();
      this.route(this.state.view);
    });
  },

  async deleteCompany(id) {
    const c = this.state.companies.find(x => x.id === id);
    const ok = await UI.confirm(`Delete "${c?.name || id}" permanently? This also removes linked contacts.`, { requirePassword: true });
    if (!ok) return;
    const relatedContacts = this.state.contacts.filter(x => x.companyId === id);
    await DB.companies.delete(id);
    for (const rc of relatedContacts) await DB.contacts.delete(rc.id);
    this.state.companies = this.state.companies.filter(x => x.id !== id);
    this.state.contacts = this.state.contacts.filter(x => x.companyId !== id);
    await this.logChange({
      action: 'delete', entityType: 'Company', entityId: id, entityName: c?.name || id,
      snapshot: c ? { ...c, _relatedContacts: relatedContacts } : null, fullData: c ? { ...c } : null
    });
    UI.toast('Company deleted', 'success');
    this.route(this.state.view);
  },

  async logFollowUp(entityType, id, text) {
    const isCompany = entityType === 'Company';
    const store = isCompany ? this.state.companies : this.state.contacts;
    const dbStore = isCompany ? DB.companies : DB.contacts;
    const rec = store.find(x => x.id === id);
    if (!rec) return;
    const before = { ...rec };
    const today = UI.todayISO();
    rec.followUpCount = (Number(rec.followUpCount) || 0) + 1;
    rec.followUpLog = [...(rec.followUpLog || []), { date: today, text }];
    rec.lastContactDate = today;
    rec.updatedAt = nowISO();
    rec.version = (Number(rec.version) || 1) + 1;
    await dbStore.put(rec);
    await this.logChange({
      action: 'followup', entityType, entityId: rec.id, entityName: rec.name,
      message: `Logged follow-up with ${rec.name}: ${text}`, snapshot: before, fullData: { ...rec }
    });
    UI.toast('Follow-up logged', 'success');
    this.route(this.state.view);
  },

  wireKanbanDnD() {
    let dragged = null;
    document.querySelectorAll('.kanban-card').forEach(card => {
      card.addEventListener('dragstart', () => { dragged = card; card.classList.add('dragging'); });
      card.addEventListener('dragend', () => { card.classList.remove('dragging'); dragged = null; });
      card.addEventListener('click', () => this.openCompanyForm(card.dataset.id));
    });
    document.querySelectorAll('.kanban-drop').forEach(zone => {
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drop-hover'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drop-hover'));
      zone.addEventListener('drop', async (e) => {
        e.preventDefault();
        zone.classList.remove('drop-hover');
        if (!dragged) return;
        const id = dragged.dataset.id;
        const stage = zone.dataset.stage;
        const c = this.state.companies.find(x => x.id === id);
        if (c && c.pipeline !== stage) {
          const before = { ...c };
          const from = c.pipeline;
          c.pipeline = stage;
          c.updatedAt = nowISO();
          c.version = (Number(c.version) || 1) + 1;
          await DB.companies.put(c);
          await this.logChange({
            action: 'update', entityType: 'Company', entityId: c.id, entityName: c.name,
            changes: [{ field: 'pipeline', label: 'Sales Pipeline', old: from, new: stage }], snapshot: before, fullData: { ...c }
          });
          UI.toast(`Moved to ${stage}`, 'success');
          this.renderKanban();
        }
      });
    });
  },
